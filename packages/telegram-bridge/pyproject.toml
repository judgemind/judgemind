[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/telegram_bridge"]

[project]
name = "judgemind-telegram-bridge"
version = "0.1.0"
description = "Python client library for sending Telegram messages and polling for inbound commands"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
    "httpx>=0.27",
    "boto3>=1.34",
    "anthropic>=0.40",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.1",
    "ruff>=0.3",
    "respx>=0.21",
    "moto[sqs,secretsmanager]>=5.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "ANN"]
ignore = ["ANN401"]

[tool.ruff.lint.isort]
known-first-party = ["telegram_bridge"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "--cov=src --cov-report=term --cov-report=html:htmlcov --cov-report=xml:coverage.xml"
