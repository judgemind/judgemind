[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/framework", "src/courts", "src/templates", "src/validation", "src/ingestion"]

[project]
name = "judgemind-scraper-framework"
version = "0.1.0"
description = "Court data scraping framework for Judgemind"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
    "charset-normalizer>=3.0",
    "httpx>=0.27",
    "playwright>=1.42",
    "beautifulsoup4>=4.12",
    "lxml>=5.1",
    "pdfplumber>=0.11",
    "pymupdf>=1.24",
    "redis>=5.0",
    "boto3>=1.34",
    "pydantic>=2.6",
    "structlog>=24.1",
    "opensearch-py>=2.4",
    "psycopg[binary]>=3.1",
    "anthropic>=0.40",
    "google-genai>=1.0,<2.0",
    "rapidfuzz>=3.0",
    "judgemind-config",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.1",
    "pytest-xdist>=3.5",
    "ruff>=0.3",
    "respx>=0.21",       # httpx mocking
    "moto[s3]>=5.0",     # AWS mocking
    "opensearch-py>=2.4", # OpenSearch client for indexer tests
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "ANN", "DTZ"]
ignore = [
    "ANN401",  # ANN401 conflicts with **kwargs: Any, which is the correct annotation
    "DTZ001",  # datetime() without tzinfo — too noisy for hearing-date constructors
    "DTZ007",  # strptime() without %z — hearing-date parsing uses naive dates
]

[tool.ruff.lint.isort]
known-first-party = ["framework", "courts", "templates", "validation", "ingestion"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "--cov=framework --cov=courts --cov=templates --cov=validation --cov=ingestion --cov-report=term --cov-report=html:htmlcov --cov-report=xml:coverage.xml"
markers = [
    "regression: scraper regression tests against archived fixtures",
    "normalization_integration: contract tests for normalize_motion_type vs scraper outputs",
]
