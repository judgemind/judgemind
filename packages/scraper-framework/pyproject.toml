[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/framework", "src/courts", "src/validation", "src/ingestion"]

[project]
name = "judgemind-scraper-framework"
version = "0.1.0"
description = "Court data scraping framework for Judgemind"
requires-python = ">=3.12"
license = "Apache-2.0"
# Every runtime dependency carries an upper bound at the next major above the
# version the image resolves (next minor for 0.x). A major bump is a deliberate
# PR with tests. Enforced by scripts/check-dependency-upper-bounds.py; policy in
# docs/agent/code-standards.md §Dependency version bounds (#4756, after #4705).
dependencies = [
    "charset-normalizer>=3.0,<4",
    "httpx>=0.27,<0.29",
    "certifi>=2024.2.2",  # proxied TLS context = certifi + Bright Data root (#4668); already an httpx dep
    "playwright>=1.42,<2",
    "playwright-stealth>=2.0,<3.0",
    "patchright>=1.58,<2.0",
    "beautifulsoup4>=4.12,<5",
    "lxml>=5.1,<7",
    "pdfplumber>=0.11,<0.12",
    "pymupdf>=1.24,<2",
    "redis>=5.0,<9",
    "boto3>=1.34,<2",
    "pydantic>=2.6,<3",
    "structlog>=24.1,<27",
    "opensearch-py>=2.4,<4",
    "psycopg[binary]>=3.1,<4",
    "anthropic>=0.40,<2",
    "google-genai>=1.0,<2.0",
    "rapidfuzz>=3.0,<4",
    "croniter>=2.0,<7",
    "judgemind-config",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=7.1.0",
    "diff-cover>=9.0",   # pre-push diff-coverage gate (#4719)
    "pytest-testmon>=2.1",
    "pytest-xdist>=3.5",
    "ruff>=0.3",
    "respx>=0.21",       # httpx mocking
    "moto[s3]>=5.0",     # AWS mocking
    "opensearch-py>=2.4", # OpenSearch client for indexer tests
]

[tool.judgemind.dependency-bounds.unbounded-ok]
certifi = "Mozilla CA bundle, calendar-versioned; must keep tracking upstream root-store updates"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "ANN", "DTZ"]
ignore = [
    "ANN401",  # ANN401 conflicts with **kwargs: Any, which is the correct annotation
    "DTZ001",  # datetime() without tzinfo — too noisy for hearing-date constructors
    "DTZ007",  # strptime() without %z — hearing-date parsing uses naive dates
]

[tool.ruff.lint.isort]
known-first-party = ["framework", "courts", "validation", "ingestion"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]
addopts = "--cov=framework --cov=courts --cov=validation --cov=ingestion --cov-report=term --cov-report=html:htmlcov --cov-report=xml:coverage.xml"
markers = [
    "regression: scraper regression tests against archived fixtures",
    "normalization_integration: contract tests for normalize_motion_type vs scraper outputs",
]
