[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/judgemind_config"]

[project]
name = "judgemind-config"
version = "0.1.0"
description = "Shared configuration constants for Judgemind packages"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=7.1.0",
    "pytest-testmon>=2.1",
    "pytest-xdist>=3.5",
    "ruff>=0.3",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "ANN"]
ignore = ["ANN401"]

[tool.ruff.lint.isort]
known-first-party = ["judgemind_config"]

[tool.pytest.ini_options]
addopts = "--cov=judgemind_config --cov-report=term --cov-report=html:htmlcov --cov-report=xml:coverage.xml"
