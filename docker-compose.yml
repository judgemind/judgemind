version: '3.8'

# Local development stack for Judgemind
# Run: docker compose up -d
# This gives you PostgreSQL, Redis, OpenSearch, and Qdrant locally.
# Application code runs on your host machine (not in containers) during development.

services:
  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: judgemind
      POSTGRES_USER: judgemind
      POSTGRES_PASSWORD: localdev
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./packages/api/src/data-access/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U judgemind"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  opensearch:
    image: opensearchproject/opensearch:2.12.0
    ports:
      - "9200:9200"
    environment:
      - discovery.type=single-node
      - DISABLE_SECURITY_PLUGIN=true
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
    volumes:
      - opensearch_data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  qdrant:
    image: qdrant/qdrant:v1.8.0
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:6333/healthz || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Dedicated Postgres for dispatcher integration tests (#2895).
  #
  # Separate from the main `postgres` service because:
  #
  # - Integration tests DROP + CREATE SCHEMA dispatcher between runs to
  #   guarantee a clean slate. Doing that against the primary dev DB
  #   would nuke local dispatcher state an operator may care about.
  # - The image (`postgres:16-alpine`) mirrors dev RDS's engine major
  #   version (16) and the CI job's `services:` image, so the integration
  #   suite validates against the same Postgres we run in production.
  # - Uses port 5433 on the host to avoid colliding with the main
  #   `postgres` service on 5432 when both are running.
  #
  # Tests read ``INTEGRATION_DATABASE_URL`` from the environment and
  # skip themselves when unset, so the service is opt-in:
  #   docker compose up -d dispatcher-test-postgres
  #   export INTEGRATION_DATABASE_URL=postgresql://postgres:localdev@localhost:5433/dispatcher_test
  #   pytest scripts/dispatcher/tests/test_task_claim_integration.py -v
  dispatcher-test-postgres:
    image: postgres:16-alpine
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: dispatcher_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: localdev
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d dispatcher_test"]
      interval: 5s
      timeout: 5s
      retries: 5

  # MinIO provides S3-compatible object storage locally
  minio:
    image: minio/minio:latest
    ports:
      - "9000:9000"
      - "9001:9001" # Console UI
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
  opensearch_data:
  qdrant_data:
  minio_data:
