name: "ECS Deploy"
description: >
  Shared ECS deployment logic: fetches the desired-state container_definitions
  (from terraform-managed SSM when configured, otherwise from the current
  running task definition), substitutes the new image URI, registers a new
  revision, and either updates an ECS service or an EventBridge Scheduler
  target.

inputs:
  task-family:
    description: "ECS task definition family name"
    required: true
  container-name:
    description: "Name of the container in the task definition to update"
    required: true
  image-uri:
    description: "Full ECR image URI including tag (e.g. 123456.dkr.ecr.us-west-2.amazonaws.com/repo:tag)"
    required: true
  deploy-mode:
    description: "'service' to update an ECS service, 'scheduler' to update an EventBridge Scheduler target"
    required: true
  ecs-cluster:
    description: "ECS cluster name (required for 'service' mode)"
    required: false
    default: ""
  ecs-service:
    description: "ECS service name (required for 'service' mode)"
    required: false
    default: ""
  scheduler-name:
    description: "EventBridge Scheduler name (required for 'scheduler' mode)"
    required: false
    default: ""
  desired-container-definitions-ssm-parameter:
    description: >
      Optional SSM Parameter Store name (or ARN) holding the terraform-rendered
      container_definitions JSON. When set, the action reads desired
      container_definitions from this parameter instead of from the running
      task definition — preventing the deploy-* preserve-secrets bug where a
      revision registered from stale running content silently re-introduces
      fields terraform has since removed. See #3765 / #2840.
    required: false
    default: ""

outputs:
  task-definition-arn:
    description: "ARN of the newly registered task definition"
    value: ${{ steps.register.outputs.arn }}

runs:
  using: "composite"
  steps:
    - name: Validate inputs
      shell: bash
      run: |
        if [ "${{ inputs.deploy-mode }}" = "service" ]; then
          if [ -z "${{ inputs.ecs-cluster }}" ] || [ -z "${{ inputs.ecs-service }}" ]; then
            echo "ERROR: 'ecs-cluster' and 'ecs-service' are required for deploy-mode=service"
            exit 1
          fi
        elif [ "${{ inputs.deploy-mode }}" = "scheduler" ]; then
          if [ -z "${{ inputs.scheduler-name }}" ]; then
            echo "ERROR: 'scheduler-name' is required for deploy-mode=scheduler"
            exit 1
          fi
        else
          echo "ERROR: deploy-mode must be 'service' or 'scheduler', got '${{ inputs.deploy-mode }}'"
          exit 1
        fi

    - name: Render and register new task definition revision
      id: register
      shell: bash
      env:
        IMAGE_URI: ${{ inputs.image-uri }}
        CONTAINER_NAME: ${{ inputs.container-name }}
        TASK_FAMILY: ${{ inputs.task-family }}
        SSM_PARAMETER: ${{ inputs.desired-container-definitions-ssm-parameter }}
      run: |
        # Source the new container_definitions from terraform-managed SSM
        # (when configured) or from the running task-definition (legacy).
        # See scripts/ecs-render-task-def.sh and #3765 / #2840 for the
        # full rationale on why the SSM source path exists.
        SCRIPT_ARGS=(
          --task-family "$TASK_FAMILY"
          --container-name "$CONTAINER_NAME"
          --image-uri "$IMAGE_URI"
        )
        if [ -n "$SSM_PARAMETER" ]; then
          SCRIPT_ARGS+=(--desired-container-definitions-ssm-parameter "$SSM_PARAMETER")
          echo "Using terraform-managed SSM parameter as desired-state source: $SSM_PARAMETER"
        else
          echo "Using running task-definition as desired-state source (legacy)."
        fi

        NEW_TASK_DEF_ARN=$("${GITHUB_WORKSPACE}/scripts/ecs-render-task-def.sh" "${SCRIPT_ARGS[@]}")

        echo "New task definition ARN: $NEW_TASK_DEF_ARN"
        echo "arn=$NEW_TASK_DEF_ARN" >> "$GITHUB_OUTPUT"

    - name: Update ECS service
      if: inputs.deploy-mode == 'service'
      shell: bash
      env:
        NEW_TASK_DEF_ARN: ${{ steps.register.outputs.arn }}
        ECS_CLUSTER: ${{ inputs.ecs-cluster }}
        ECS_SERVICE: ${{ inputs.ecs-service }}
      run: |
        aws ecs update-service \
          --cluster "$ECS_CLUSTER" \
          --service "$ECS_SERVICE" \
          --task-definition "$NEW_TASK_DEF_ARN" \
          --force-new-deployment \
          --query 'service.serviceName' \
          --output text

        # Wait for OUR task definition's deployment to reach a terminal state.
        #
        # This replaces `aws ecs wait services-stable`, which:
        #   - polls every 15s for 40 attempts (10 min) with no way to customize;
        #   - emits no progress output, making it hard to distinguish a real
        #     timeout from a workflow cancellation (e.g. concurrency.cancel-in-
        #     progress firing on a rapid follow-up merge, see #1867); and
        #   - waits on "service stable" rather than on our specific deployment,
        #     which can report steady state on an old deployment before the new
        #     one begins rolling.
        #
        # See issue #2519 for the full motivation. The logic lives in a separate
        # script so it can be shellchecked and unit-tested with a mock AWS CLI.
        # Single source of truth at scripts/wait-for-rollout.sh (see #2523) —
        # also invoked directly by scripts/ecs-redeploy.sh for operator-run
        # manual redeploys.
        "${GITHUB_WORKSPACE}/scripts/wait-for-rollout.sh"

    - name: Update EventBridge Scheduler target
      if: inputs.deploy-mode == 'scheduler'
      shell: bash
      env:
        NEW_TASK_DEF_ARN: ${{ steps.register.outputs.arn }}
        SCHEDULER_NAME: ${{ inputs.scheduler-name }}
      run: |
        # Get the current schedule configuration
        SCHEDULE_JSON=$(aws scheduler get-schedule \
          --name "$SCHEDULER_NAME" \
          --output json)

        # Update the task definition ARN in the target's ECS parameters
        UPDATED_TARGET=$(echo "$SCHEDULE_JSON" | jq --arg arn "$NEW_TASK_DEF_ARN" \
          '.Target.EcsParameters.TaskDefinitionArn = $arn | .Target')

        # Extract schedule fields needed for update
        SCHEDULE_EXPR=$(echo "$SCHEDULE_JSON" | jq -r '.ScheduleExpression')
        SCHEDULE_TZ=$(echo "$SCHEDULE_JSON" | jq -r '.ScheduleExpressionTimezone')
        STATE=$(echo "$SCHEDULE_JSON" | jq -r '.State')
        FLEX_WINDOW=$(echo "$SCHEDULE_JSON" | jq -c '.FlexibleTimeWindow')
        DESCRIPTION=$(echo "$SCHEDULE_JSON" | jq -r '.Description // empty')

        # Build update-schedule command
        UPDATE_ARGS=(
          --name "$SCHEDULER_NAME"
          --schedule-expression "$SCHEDULE_EXPR"
          --schedule-expression-timezone "$SCHEDULE_TZ"
          --state "$STATE"
          --flexible-time-window "$FLEX_WINDOW"
          --target "$UPDATED_TARGET"
        )

        if [ -n "$DESCRIPTION" ]; then
          UPDATE_ARGS+=(--description "$DESCRIPTION")
        fi

        aws scheduler update-schedule "${UPDATE_ARGS[@]}"

        echo "Updated scheduler '$SCHEDULER_NAME' to use task definition: $NEW_TASK_DEF_ARN"
