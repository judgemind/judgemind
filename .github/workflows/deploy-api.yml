name: Deploy API

on:
  push:
    branches: [main]
    paths:
      - "packages/api/**"
      - ".github/workflows/deploy-api.yml"
      - ".github/actions/ecs-deploy/**"
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Optional image tag (defaults to git SHA)"
        required: false
        type: string

permissions:
  contents: read
  statuses: write

concurrency:
  group: deploy-api-${{ github.ref }}
  cancel-in-progress: false

env:
  AWS_REGION: us-west-2
  ECR_REPOSITORY: judgemind/api
  ECS_CLUSTER: judgemind-dev
  ECS_SERVICE: judgemind-api-dev
  TASK_FAMILY: judgemind-api-dev
  CONTAINER_NAME: api

jobs:
  build-and-push:
    name: Build and Push to ECR
    runs-on: ubuntu-latest
    outputs:
      image_uri: ${{ steps.build.outputs.image_uri }}
      sha_tag: ${{ steps.build.outputs.sha_tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Get AWS account ID
        id: aws-account
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          echo "id=$ACCOUNT_ID" >> "$GITHUB_OUTPUT"

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        id: build
        env:
          ECR_REGISTRY: ${{ steps.aws-account.outputs.id }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com
        run: |
          IMAGE_BASE="$ECR_REGISTRY/$ECR_REPOSITORY"
          SHA_TAG="${GITHUB_SHA::7}"
          BRANCH_TAG="${GITHUB_REF_NAME//\//-}"
          CUSTOM_TAG="${{ inputs.image_tag }}"

          TAGS=("-t" "$IMAGE_BASE:$SHA_TAG" "-t" "$IMAGE_BASE:latest" "-t" "$IMAGE_BASE:$BRANCH_TAG")

          if [ -n "$CUSTOM_TAG" ]; then
            TAGS+=("-t" "$IMAGE_BASE:$CUSTOM_TAG")
          fi

          docker build "${TAGS[@]}" packages/api/
          docker push "$IMAGE_BASE" --all-tags

          echo "image_uri=$IMAGE_BASE:$SHA_TAG" >> "$GITHUB_OUTPUT"
          echo "sha_tag=$SHA_TAG" >> "$GITHUB_OUTPUT"

  deploy-dev:
    name: Deploy to Dev
    needs: build-and-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Checkout (for composite action)
        uses: actions/checkout@v4

      - name: Set pending deployment status
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -s -X POST \
            -H "Authorization: token $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/statuses/${{ github.sha }}" \
            -d '{
              "state": "pending",
              "description": "Deploying API to dev...",
              "context": "deploy/api-dev"
            }'

      - name: Deploy to ECS
        id: deploy
        uses: ./.github/actions/ecs-deploy
        with:
          task-family: ${{ env.TASK_FAMILY }}
          container-name: ${{ env.CONTAINER_NAME }}
          image-uri: ${{ needs.build-and-push.outputs.image_uri }}
          deploy-mode: service
          ecs-cluster: ${{ env.ECS_CLUSTER }}
          ecs-service: ${{ env.ECS_SERVICE }}

      - name: Set deployment status
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEPLOY_STATUS: ${{ job.status == 'success' && 'success' || 'failure' }}
          DEPLOY_DESC: ${{ job.status == 'success' && 'API deployed to dev' || 'Dev deployment failed' }}
        run: |
          curl -s -X POST \
            -H "Authorization: token $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/statuses/${{ github.sha }}" \
            -d "{
              \"state\": \"$DEPLOY_STATUS\",
              \"description\": \"$DEPLOY_DESC\",
              \"context\": \"deploy/api-dev\"
            }"

  run-migrations:
    name: Run Database Migrations (Dev)
    needs: [build-and-push, deploy-dev]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check for migration changes
        id: check-migrations
        run: |
          # Check if any migration files were added or modified in this push.
          # Compare against the parent commit to detect new migrations.
          MIGRATION_CHANGES=$(git diff --name-only HEAD~1 HEAD -- packages/api/migrations/ 2>/dev/null || true)
          if [ -n "$MIGRATION_CHANGES" ]; then
            echo "has_migrations=true" >> "$GITHUB_OUTPUT"
            echo "Migration files changed:"
            echo "$MIGRATION_CHANGES"
          else
            echo "has_migrations=false" >> "$GITHUB_OUTPUT"
            echo "No migration file changes detected."
          fi

      - name: Configure AWS credentials
        if: steps.check-migrations.outputs.has_migrations == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Set pending migration status
        if: steps.check-migrations.outputs.has_migrations == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -s -X POST \
            -H "Authorization: token $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/statuses/${{ github.sha }}" \
            -d '{
              "state": "pending",
              "description": "Running database migrations on dev...",
              "context": "deploy/api-dev-migrations"
            }'

      - name: Run migrations via ECS oneshot task
        if: steps.check-migrations.outputs.has_migrations == 'true'
        id: run-migrations
        env:
          IMAGE_URI: ${{ needs.build-and-push.outputs.image_uri }}
        run: |
          # Get the API service's network configuration for the oneshot task
          SERVICE_DESC=$(aws ecs describe-services \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE" \
            --query 'services[0]' \
            --output json)

          SUBNETS=$(echo "$SERVICE_DESC" | jq -r '.networkConfiguration.awsvpcConfiguration.subnets | join(",")')
          SECURITY_GROUPS=$(echo "$SERVICE_DESC" | jq -r '.networkConfiguration.awsvpcConfiguration.securityGroups | join(",")')

          # Get the execution role and task role from the current task definition
          TASK_DEF=$(aws ecs describe-task-definition \
            --task-definition "$TASK_FAMILY" \
            --query 'taskDefinition' \
            --output json)

          EXECUTION_ROLE=$(echo "$TASK_DEF" | jq -r '.executionRoleArn')
          TASK_ROLE=$(echo "$TASK_DEF" | jq -r '.taskRoleArn // empty')
          CONTAINER_DEF=$(echo "$TASK_DEF" | jq -c '.containerDefinitions[0]')

          # Build a oneshot task definition using the newly deployed image.
          # The API container already has node-pg-migrate and migration files.
          SECRETS=$(echo "$CONTAINER_DEF" | jq -c '.secrets // []')
          ENVIRONMENT_VARS=$(echo "$CONTAINER_DEF" | jq -c '.environment // []')
          LOG_CONFIG=$(echo "$CONTAINER_DEF" | jq -c '.logConfiguration')

          ONESHOT_CONTAINER=$(jq -n \
            --arg image "$IMAGE_URI" \
            --argjson secrets "$SECRETS" \
            --argjson env_vars "$ENVIRONMENT_VARS" \
            --argjson log_config "$LOG_CONFIG" \
            '{
              name: "api-migrate",
              image: $image,
              essential: true,
              command: ["npx", "node-pg-migrate", "up", "--no-timestamp"],
              environment: $env_vars,
              secrets: $secrets,
              logConfiguration: ($log_config | .options["awslogs-stream-prefix"] = "migrate")
            }')

          # Build register args
          REGISTER_ARGS=(
            --family "judgemind-api-migrate-dev"
            --requires-compatibilities FARGATE
            --network-mode awsvpc
            --cpu 256
            --memory 512
            --execution-role-arn "$EXECUTION_ROLE"
            --container-definitions "[$ONESHOT_CONTAINER]"
          )

          if [ -n "$TASK_ROLE" ]; then
            REGISTER_ARGS+=(--task-role-arn "$TASK_ROLE")
          fi

          MIGRATE_TASK_DEF_ARN=$(aws ecs register-task-definition \
            "${REGISTER_ARGS[@]}" \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)

          echo "Registered migration task definition: $MIGRATE_TASK_DEF_ARN"
          echo "task_def_arn=$MIGRATE_TASK_DEF_ARN" >> "$GITHUB_OUTPUT"

          # Run the migration task
          RUN_OUTPUT=$(aws ecs run-task \
            --cluster "$ECS_CLUSTER" \
            --task-definition "$MIGRATE_TASK_DEF_ARN" \
            --launch-type FARGATE \
            --network-configuration "awsvpcConfiguration={subnets=[$SUBNETS],securityGroups=[$SECURITY_GROUPS],assignPublicIp=DISABLED}" \
            --output json)

          TASK_ARN=$(echo "$RUN_OUTPUT" | jq -r '.tasks[0].taskArn // empty')

          if [ -z "$TASK_ARN" ]; then
            echo "Error: failed to launch migration task."
            echo "$RUN_OUTPUT" | jq '.failures'
            exit 1
          fi

          echo "Migration task launched: $TASK_ARN"
          echo "task_arn=$TASK_ARN" >> "$GITHUB_OUTPUT"

          # Wait for the task to complete (migrations should be fast — 5 min timeout)
          echo "Waiting for migration task to complete..."
          aws ecs wait tasks-stopped \
            --cluster "$ECS_CLUSTER" \
            --tasks "$TASK_ARN"

          # Check exit code
          TASK_DESC=$(aws ecs describe-tasks \
            --cluster "$ECS_CLUSTER" \
            --tasks "$TASK_ARN" \
            --output json)

          EXIT_CODE=$(echo "$TASK_DESC" | jq -r '.tasks[0].containers[0].exitCode // 1')
          STOP_REASON=$(echo "$TASK_DESC" | jq -r '.tasks[0].stoppedReason // empty')

          echo "Migration task exit code: $EXIT_CODE"
          if [ -n "$STOP_REASON" ]; then
            echo "Stop reason: $STOP_REASON"
          fi

          # Deregister the oneshot task definition (cleanup)
          aws ecs deregister-task-definition \
            --task-definition "$MIGRATE_TASK_DEF_ARN" \
            --output text > /dev/null 2>&1 || true

          if [ "$EXIT_CODE" != "0" ]; then
            echo "Migration failed with exit code $EXIT_CODE"
            exit 1
          fi

          echo "Migrations applied successfully."

      - name: Set migration status
        if: always() && steps.check-migrations.outputs.has_migrations == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MIGRATE_STATUS: ${{ steps.run-migrations.outcome == 'success' && 'success' || 'failure' }}
          MIGRATE_DESC: ${{ steps.run-migrations.outcome == 'success' && 'Dev migrations applied' || 'Dev migration failed' }}
        run: |
          curl -s -X POST \
            -H "Authorization: token $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/statuses/${{ github.sha }}" \
            -d "{
              \"state\": \"$MIGRATE_STATUS\",
              \"description\": \"$MIGRATE_DESC\",
              \"context\": \"deploy/api-dev-migrations\"
            }"

      - name: Skip notification (no migrations)
        if: steps.check-migrations.outputs.has_migrations == 'false'
        run: echo "No migration changes in this deploy — skipping migration step."

  post-deploy-health-check:
    name: Post-Deploy Health Check
    needs: [deploy-dev, run-migrations]
    if: always() && needs.deploy-dev.result == 'success'
    runs-on: ubuntu-latest

    env:
      API_URL: https://dev.api.judgemind.org/graphql

    steps:
      - name: Wait for service to stabilize
        run: |
          echo "Waiting 30 seconds for new tasks to fully start..."
          sleep 30

      - name: Health check — GraphQL introspection
        id: introspection
        run: |
          HTTP_CODE=$(curl -s -o /tmp/response.json -w '%{http_code}' \
            --max-time 15 \
            --retry 3 \
            --retry-delay 10 \
            -X POST "$API_URL" \
            -H 'Content-Type: application/json' \
            -d '{"query":"{ __typename }"}')

          echo "HTTP status: $HTTP_CODE"

          if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
            echo "GraphQL endpoint is responding."
            cat /tmp/response.json | head -c 500
            echo ""
          else
            echo "ERROR: GraphQL endpoint returned HTTP $HTTP_CODE"
            cat /tmp/response.json 2>/dev/null || true
            exit 1
          fi

      - name: Health check — sample query
        id: sample-query
        run: |
          HTTP_CODE=$(curl -s -o /tmp/sample_response.json -w '%{http_code}' \
            --max-time 15 \
            --retry 2 \
            --retry-delay 5 \
            -X POST "$API_URL" \
            -H 'Content-Type: application/json' \
            -d '{"query":"{ rulings(first: 1) { edges { node { id } } } }"}')

          echo "HTTP status: $HTTP_CODE"

          if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
            # Check for GraphQL errors in the response
            ERRORS=$(cat /tmp/sample_response.json | python3 -c "import sys,json; d=json.load(sys.stdin); print(len(d.get('errors',[])))") 2>/dev/null || echo "parse_error"

            if [ "$ERRORS" = "0" ]; then
              echo "Sample query succeeded without errors."
            elif [ "$ERRORS" = "parse_error" ]; then
              echo "WARNING: Could not parse response, but HTTP status was OK."
            else
              echo "ERROR: GraphQL returned errors in response."
              cat /tmp/sample_response.json | head -c 1000
              exit 1
            fi
          else
            echo "ERROR: Sample query returned HTTP $HTTP_CODE"
            cat /tmp/sample_response.json 2>/dev/null || true
            exit 1
          fi

      - name: Set health check status
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEALTH_STATUS: ${{ (steps.introspection.outcome == 'success' && steps.sample-query.outcome == 'success') && 'success' || 'failure' }}
          HEALTH_DESC: ${{ (steps.introspection.outcome == 'success' && steps.sample-query.outcome == 'success') && 'API health check passed' || 'API health check failed' }}
        run: |
          curl -s -X POST \
            -H "Authorization: token $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/statuses/${{ github.sha }}" \
            -d "{
              \"state\": \"$HEALTH_STATUS\",
              \"description\": \"$HEALTH_DESC\",
              \"context\": \"deploy/api-dev-health\"
            }"
