name: Terraform

on:
  push:
    branches: [main]
    paths:
      - "infra/terraform/**"
      - ".github/workflows/terraform.yml"
      # scripts/wait-for-rollout.sh is invoked by the dev-apply job's
      # post-apply force-deploy step (#4044). The shared script's paths-
      # filter contract (#2592) requires every consumer to list it so a
      # PR that touches only the script triggers each consumer's deploy
      # path on its own merge — otherwise regressions surface on the
      # next unrelated apply.
      - "scripts/wait-for-rollout.sh"
      # scripts/check-no-nonascii-tf-descriptions.sh is invoked by the
      # `Check no non-ASCII in tf descriptions` step. Same paths-filter
      # contract — a regression in the hygiene check would otherwise
      # only surface on the next unrelated terraform PR (see #4084).
      - "scripts/check-no-nonascii-tf-descriptions.sh"
  pull_request:
    branches: [main]
    paths:
      - "infra/terraform/**"
      - ".github/workflows/terraform.yml"
      - "scripts/wait-for-rollout.sh"
      - "scripts/check-no-nonascii-tf-descriptions.sh"

jobs:
  terraform:
    name: Validate and Plan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: us-west-2
      TF_IN_AUTOMATION: true

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "~1.5"

      # Format check runs across all Terraform code without credentials.
      - name: Terraform Format Check
        run: terraform fmt -check -recursive infra/terraform/

      # Hygiene check: AWS rejects non-ASCII bytes in `description` fields
      # for several resource types (security groups, IAM roles, IAM policies)
      # at apply time. terraform validate does NOT catch this. See #3321.
      - name: Check no non-ASCII in tf descriptions
        run: scripts/check-no-nonascii-tf-descriptions.sh

      # Validate each environment. Uses -backend=false so no AWS credentials
      # are required for syntax and config validation.
      - name: Validate dev
        run: |
          terraform -chdir=infra/terraform/environments/dev init -backend=false
          terraform -chdir=infra/terraform/environments/dev validate

      - name: Validate production
        run: |
          terraform -chdir=infra/terraform/environments/production init -backend=false
          terraform -chdir=infra/terraform/environments/production validate

      # Precondition fixture test: verifies that the dispatcher-daemon module
      # raises a plan-time error when desired_count > 0 and required secret
      # ARNs are empty. Uses fake AWS credentials so no real API calls are made.
      - name: Dispatcher precondition check
        if: ${{ env.AWS_ACCESS_KEY_ID != '' }}
        run: bash infra/terraform/modules/dispatcher-daemon/tests/preconditions/check.sh

      # Postcondition fixture test (#3764, parent #2840): verifies that the
      # content-level postcondition pattern fires when the rendered
      # container_definitions JSON is missing a required secret entry while
      # its ARN variable is non-empty. Defense-in-depth against the silent-
      # drop bug class where terraform apply produces a task-def revision
      # without a required secret despite the HCL conditional being correct.
      - name: Dispatcher postcondition check
        if: ${{ env.AWS_ACCESS_KEY_ID != '' }}
        run: bash infra/terraform/modules/dispatcher-daemon/tests/postconditions/check.sh

      # Postcondition fixture tests for the remaining ECS task-def modules
      # (#3768, parent #2840): same defense-in-depth pattern as the dispatcher
      # check above — verifies that the content-level postcondition fires when
      # the rendered container_definitions JSON drops a required secret entry
      # while its ARN variable remains non-empty.
      - name: api-service postcondition check
        if: ${{ env.AWS_ACCESS_KEY_ID != '' }}
        run: bash infra/terraform/modules/api-service/tests/postconditions/check.sh

      - name: compute postcondition check
        if: ${{ env.AWS_ACCESS_KEY_ID != '' }}
        run: bash infra/terraform/modules/compute/tests/postconditions/check.sh

      - name: scraper-zero-record-check postcondition check
        if: ${{ env.AWS_ACCESS_KEY_ID != '' }}
        run: bash infra/terraform/modules/scraper-zero-record-check/tests/postconditions/check.sh

      - name: dispatcher-agent-runner postcondition check
        if: ${{ env.AWS_ACCESS_KEY_ID != '' }}
        run: bash infra/terraform/modules/dispatcher-agent-runner/tests/postconditions/check.sh

      # Policy-shape regression test for dispatcher-v3-iam (#3888). Static
      # analysis of the rendered HCL — no AWS credentials needed. Asserts
      # the spec §10 invariants (no cross-account principal, launcher
      # scope is narrow, agent task role pinned to dev account).
      - name: dispatcher-v3-iam policy-shape check
        run: bash infra/terraform/modules/dispatcher-v3-iam/tests/policy-checks/check.sh

      # Policy-shape regression test for dispatcher-v3-sessions-bucket
      # (#3891). Static analysis of the rendered HCL — no AWS
      # credentials needed. Asserts the spec §4.1 invariants (bucket is
      # private, lifecycle uses GLACIER_IR not deep Glacier, bucket
      # policy is scoped to the agent_task_role and grants only
      # PutObject + GetObject).
      - name: dispatcher-v3-sessions-bucket policy-shape check
        run: bash infra/terraform/modules/dispatcher-v3-sessions-bucket/tests/policy-checks/check.sh

      # Check-block fixture test for dispatcher-v3-scheduled-skills (#3890).
      # Verifies the module's two `check` blocks fire at plan time when
      # the input config violates them: a task-def-arn / family mismatch
      # (would AccessDenied at every cron firing) and enable_alerts=true
      # paired with an empty alert_sns_topic_arn (would leave the alarm
      # with no destination — closes adversarial-review MAJOR 7 only when
      # the alarm can actually page).
      - name: dispatcher-v3-scheduled-skills check-block fixture
        if: ${{ env.AWS_ACCESS_KEY_ID != '' }}
        run: bash infra/terraform/modules/dispatcher-v3-scheduled-skills/tests/postconditions/check.sh

      # Postcondition fixture test for dispatcher-v3-task-defs (#3941, F2).
      # Same defense-in-depth pattern as the v2 dispatcher-daemon /
      # api-service / compute checks above — exercises the module's
      # content-level postconditions on the rendered container_definitions
      # JSON. Three regression classes are covered:
      #   * #3764 / #2840 — silent-drop bug where a required secret entry
      #     is missing despite the ARN variable being non-empty.
      #   * #3754 — image-staleness drift caused by a mutable :latest tag
      #     instead of a digest-pinned @sha256:<digest> reference.
      #   * #3940 — Fargate's stopTimeout > 120s rejection. The pre-#3940
      #     code rendered the wall-clock cap (21600 / 3600 / 7200) into
      #     containerDefinitions[].stopTimeout, which Fargate rejects at
      #     RegisterTaskDefinition; the fix splits stopTimeout (hardcoded
      #     to 120) from the launcher-side wall-clock cap. The fixture's
      #     `aws_ecs_task_definition.broken_stop_timeout` resource sets
      #     stopTimeout = 21600 to verify the regression guard fires.
      - name: dispatcher-v3-task-defs postcondition check
        if: ${{ env.AWS_ACCESS_KEY_ID != '' }}
        run: bash infra/terraform/modules/dispatcher-v3-task-defs/tests/postconditions/check.sh

      # Plan requires AWS credentials (stored as GitHub Actions secrets).
      # The plan confirms the module is deployable and shows exactly what
      # resources will be created or modified.
      #
      # To enable: add AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY to the
      # repository's Actions secrets (Settings → Secrets and variables → Actions).
      - name: Terraform Init (dev)
        if: ${{ env.AWS_ACCESS_KEY_ID != '' }}
        run: terraform -chdir=infra/terraform/environments/dev init

      - name: Terraform Plan (dev)
        if: ${{ env.AWS_ACCESS_KEY_ID != '' }}
        run: |
          for attempt in 1 2 3; do
            echo "::group::Plan attempt $attempt"
            if terraform -chdir=infra/terraform/environments/dev plan \
                -no-color -input=false -lock-timeout=120s; then
              echo "::endgroup::"
              exit 0
            fi
            ec=$?
            echo "::endgroup::"
            if [ "$attempt" -lt 3 ]; then
              echo "Plan attempt $attempt failed (exit $ec), retrying in 10s..."
              sleep 10
            fi
          done
          echo "::error::Terraform plan failed after 3 attempts"
          exit 1

  # Auto-apply for the dev environment after infra changes merge to main.
  # Runs only on push:main (skipped for pull_request events) and depends on
  # the `terraform` job above, so apply only fires if validate + plan both
  # succeeded on the merge commit. Production applies remain human-only
  # (#3104).
  dev-apply:
    name: Apply dev
    needs: terraform
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: us-west-2
      TF_IN_AUTOMATION: true

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "~1.5"

      - name: Skip if AWS credentials are missing
        if: ${{ env.AWS_ACCESS_KEY_ID == '' }}
        run: |
          echo "::warning::AWS credentials are not configured; skipping dev apply."
          echo "Skipped: AWS credentials not configured." >> "$GITHUB_STEP_SUMMARY"

      # Fresh init on the runner: no -lockfile=readonly so the provider cache
      # can be populated. Backend access requires the repo's AWS creds.
      - name: Terraform Init (dev)
        if: ${{ env.AWS_ACCESS_KEY_ID != '' }}
        run: terraform -chdir=infra/terraform/environments/dev init -input=false

      # Apply mirrors the plan job's 3-attempt retry pattern so transient
      # state-lock timeouts don't fail the merge commit's apply.
      - name: Terraform Apply (dev)
        if: ${{ env.AWS_ACCESS_KEY_ID != '' }}
        id: apply
        run: |
          set -o pipefail
          apply_log="${RUNNER_TEMP}/terraform-apply-dev.log"
          : > "$apply_log"
          for attempt in 1 2 3; do
            echo "::group::Apply attempt $attempt"
            if terraform -chdir=infra/terraform/environments/dev apply \
                -auto-approve -input=false -lock-timeout=120s -no-color \
                2>&1 | tee -a "$apply_log"; then
              echo "::endgroup::"
              echo "apply_log=$apply_log" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            ec=$?
            echo "::endgroup::"
            if [ "$attempt" -lt 3 ]; then
              echo "Apply attempt $attempt failed (exit $ec), retrying in 10s..."
              sleep 10
            fi
          done
          echo "::error::Terraform apply failed after 3 attempts"
          echo "apply_log=$apply_log" >> "$GITHUB_OUTPUT"
          exit 1

      # Inline audit trail: paste the last section of the apply output
      # (which includes the "Apply complete! N added, M changed, K destroyed"
      # summary line) into the workflow run's step summary.
      - name: Publish apply summary
        if: ${{ always() && env.AWS_ACCESS_KEY_ID != '' && steps.apply.outputs.apply_log != '' }}
        run: |
          apply_log="${{ steps.apply.outputs.apply_log }}"
          {
            echo "## Terraform apply (dev)"
            echo
            echo "Commit: \`${GITHUB_SHA}\`"
            echo
            echo "### Tail of apply output"
            echo
            echo '```'
            tail -n 200 "$apply_log" || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Force-deploy the ingestion-worker service when this apply touched
      # its task-def or its rendered container_definitions SSM parameter
      # (#4044, Option B). `aws_ecs_service.ingestion_worker.lifecycle.
      # ignore_changes = [task_definition]` means terraform never rolls
      # the service forward on its own — without this step, an infra-only
      # change leaves the running container on the *old* revision until
      # the next deploy-scraper.yml run wins the race against another
      # apply. Self-contained: makes terraform-apply the single place
      # that's responsible for getting an infra-induced task-def change
      # onto the running service.
      #
      # The detection grep looks for `Creating|Modifying|Destroying...`
      # lines (the apply-time mutation verbs) targeting either the
      # task-def or the SSM parameter resource address. Plain
      # "Refreshing state..." lines run on every apply for every
      # resource and are explicitly excluded so we only force-deploy
      # when something actually changed.
      #
      # No-op fast path: if neither resource changed, the step exits 0
      # without making any AWS API calls.
      - name: Detect ingestion-worker task-def change
        if: ${{ env.AWS_ACCESS_KEY_ID != '' && steps.apply.outputs.apply_log != '' }}
        id: detect-ingestion-worker-change
        run: |
          apply_log="${{ steps.apply.outputs.apply_log }}"
          if grep -E '^module\.compute\.(aws_ecs_task_definition\.ingestion_worker|aws_ssm_parameter\.ingestion_worker_container_definitions)\[0\]: (Creating|Modifying|Destroying)\.\.\.' "$apply_log" >/dev/null; then
            echo "ingestion_worker_changed=true" >> "$GITHUB_OUTPUT"
            echo "Ingestion-worker task-def or container_definitions SSM parameter changed by this apply." | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "ingestion_worker_changed=false" >> "$GITHUB_OUTPUT"
            echo "Ingestion-worker resources unchanged by this apply — skipping force-deploy." | tee -a "$GITHUB_STEP_SUMMARY"
          fi

      - name: Force-deploy ingestion-worker (close lifecycle.ignore_changes gap)
        if: ${{ env.AWS_ACCESS_KEY_ID != '' && steps.detect-ingestion-worker-change.outputs.ingestion_worker_changed == 'true' }}
        env:
          ECS_CLUSTER: judgemind-dev
          ECS_SERVICE: judgemind-ingestion-worker-dev
          INGESTION_TASK_FAMILY: judgemind-ingestion-worker-dev
        run: |
          set -euo pipefail

          # Resolve the latest ACTIVE revision of the family — that is
          # whatever terraform-apply just registered. Pinning the service
          # to the family ARN (without :revision) would let ECS pick up
          # any later revision deploy-scraper.yml registers, which is
          # exactly the race we're trying to close.
          NEW_TASK_DEF_ARN=$(aws ecs describe-task-definition \
            --task-definition "$INGESTION_TASK_FAMILY" \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)
          export NEW_TASK_DEF_ARN

          echo "Forcing ingestion-worker rollout to $NEW_TASK_DEF_ARN"

          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service "$ECS_SERVICE" \
            --task-definition "$NEW_TASK_DEF_ARN" \
            --force-new-deployment \
            --query 'service.serviceName' \
            --output text

          # Wait for the rollout to finish so a CI failure on this step
          # surfaces as a deploy failure (not as silent drift). Reuses
          # scripts/wait-for-rollout.sh (env-driven: ECS_CLUSTER,
          # ECS_SERVICE, NEW_TASK_DEF_ARN — same contract as the
          # ecs-deploy composite action).
          bash "${GITHUB_WORKSPACE}/scripts/wait-for-rollout.sh"

          {
            echo "## Forced ingestion-worker rollout (#4044)"
            echo
            echo "Task-def: \`$NEW_TASK_DEF_ARN\`"
            echo
            echo "This step closed the lifecycle.ignore_changes race by"
            echo "rolling the service forward after terraform-apply"
            echo "registered the new revision. See"
            echo ".github/workflows/terraform.yml + #4044."
          } >> "$GITHUB_STEP_SUMMARY"
