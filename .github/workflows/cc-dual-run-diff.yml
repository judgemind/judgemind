name: CC Dual-Run Diff

on:
  schedule:
    # Daily at 15:00 UTC (08:00 PT) — after both CC scrapers have had the
    # overnight window to produce data. Offset from zero-record check (:30)
    # and data-quality (:15) and api-error (:45) so schedules do not collide.
    - cron: '0 15 * * *'
  # Allow manual trigger for debugging / issue verification.
  workflow_dispatch:
    inputs:
      date:
        description: "Hearing date to compare (YYYY-MM-DD, default: yesterday)"
        required: false
        type: string

# Only one diff check at a time.
concurrency:
  group: cc-dual-run-diff
  cancel-in-progress: true

permissions:
  issues: write
  contents: read

env:
  AWS_REGION: us-west-2

jobs:
  cc-dual-run-diff:
    name: Compare CC tentative-ruling coverage between retired and portal scrapers
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: |
            scripts/cc-dual-run-diff.py
            scripts/ecs-run-task.sh
            scripts/ecs-logs.sh
            scripts/notify-telegram.sh

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Build script arguments
        id: args
        run: |
          # Use provided date or fall back to yesterday in UTC
          if [ -n "${{ inputs.date }}" ]; then
            DATE_ARG="${{ inputs.date }}"
          else
            DATE_ARG=$(date -u -d "yesterday" +%Y-%m-%d)
          fi
          echo "script_args=--date ${DATE_ARG} --json" >> "$GITHUB_OUTPUT"
          echo "check_date=${DATE_ARG}" >> "$GITHUB_OUTPUT"

      - name: Run CC dual-run diff on ECS
        id: check
        env:
          SCRIPT_ARGS: ${{ steps.args.outputs.script_args }}
        run: |
          # Run on ECS so the script has DATABASE_URL injected from Secrets
          # Manager and can reach the private VPC. Use --cpu 256/--memory 512
          # since this is a lightweight SQL-only check.
          set +e
          scripts/ecs-run-task.sh \
            --cpu 256 --memory 512 \
            --timeout 300 \
            --latest-image \
            scripts/cc-dual-run-diff.py -- $SCRIPT_ARGS 2>&1 \
            | tee /tmp/check_output.txt
          EXIT_CODE=${PIPESTATUS[0]}
          set -e

          echo "exit_code=$EXIT_CODE" >> "$GITHUB_OUTPUT"

          # Extract the JSON portion from the mixed ECS log output.
          python3 - <<'PY'
          import json, re, sys
          text = open("/tmp/check_output.txt").read()
          # Extract JSON blocks starting with "{" at col 0, ending with "}" at col 0.
          matches = re.findall(r"(?ms)^\{\n.*?^\}", text)
          if not matches:
              print("Could not find JSON block in output; assuming healthy.")
              open("/tmp/check_json.txt", "w").write(
                  '{"healthy": true, "diff": [], "missing_portal_count": 0, "total_departments": 0}'
              )
              sys.exit(0)
          blob = matches[-1]
          try:
              json.loads(blob)
          except Exception as exc:
              print(f"Parsed JSON block failed to load: {exc}; assuming healthy.")
              blob = '{"healthy": true, "diff": [], "missing_portal_count": 0, "total_departments": 0}'
          open("/tmp/check_json.txt", "w").write(blob)
          PY

          HEALTHY=$(python3 -c "import json; print(json.load(open('/tmp/check_json.txt'))['healthy'])")
          if [ "$HEALTHY" = "True" ]; then
            echo "healthy=true" >> "$GITHUB_OUTPUT"
            echo "CC dual-run diff: healthy — no missing_portal departments."
          else
            echo "healthy=false" >> "$GITHUB_OUTPUT"
            echo "CC dual-run diff: breach detected (exit code $EXIT_CODE)."
          fi

      - name: Extract alert summary
        if: steps.check.outputs.healthy == 'false'
        id: summary
        env:
          CHECK_DATE: ${{ steps.args.outputs.check_date }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 - <<'PY'
          import json, os
          data = json.load(open("/tmp/check_json.txt"))
          diff = data.get("diff", [])
          missing = [r for r in diff if r.get("flag") == "missing_portal"]
          check_date = os.environ.get("CHECK_DATE", "unknown")

          lines = [
              f"**Date checked:** {check_date}",
              "",
              "| Department | Retired count | Portal count | Cases only in retired |",
              "| --- | --- | --- | --- |",
          ]
          for r in missing:
              lines.append(
                  "| {dept} | {ca} | {cb} | {only_a} |".format(
                      dept=r["department"],
                      ca=r["count_a"],
                      cb=r["count_b"],
                      only_a=", ".join(r.get("cases_only_a", [])) or "(none)",
                  )
              )
          open("/tmp/alert_summary.md", "w").write("\n".join(lines))

          # Telegram one-liner
          depts = [r["department"] for r in missing]
          open("/tmp/alert_telegram.txt", "w").write(
              f"Depts missing from portal on {check_date}: {', '.join(depts)}"
              if depts else "Unknown alert"
          )
          PY

          echo "Alert summary:"
          cat /tmp/alert_summary.md

      - name: Check for existing open issue
        if: steps.check.outputs.healthy == 'false'
        id: existing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          EXISTING=$(gh issue list \
            --repo "${{ github.repository }}" \
            --state open \
            --label "cc-dual-run-alert" \
            --json number \
            --limit 1 \
            -q '.[0].number // empty')

          if [ -n "$EXISTING" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "number=$EXISTING" >> "$GITHUB_OUTPUT"
            echo "Open cc-dual-run-alert issue already exists: #${EXISTING}"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create failure issue
        id: create-issue
        if: >-
          steps.check.outputs.healthy == 'false' &&
          steps.existing.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          CHECK_DATE: ${{ steps.args.outputs.check_date }}
        run: |
          TIMESTAMP=$(date -u +%Y-%m-%dT%H:%M:%SZ)

          {
            echo "## CC Dual-Run Diff Alert — Portal Coverage Regression"
            echo ""
            echo "The portal scraper (\`ca-cc-tentatives-portal\`) is missing"
            echo "one or more departments that the retired scraper"
            echo "(\`ca-cc-tentatives\`) captured on **${CHECK_DATE}**."
            echo "This may indicate a coverage regression in the new portal scraper."
            echo ""
            echo "### Missing Departments"
            echo ""
            cat /tmp/alert_summary.md
            echo ""
            echo ""
            echo "### Context"
            echo ""
            echo "- **Workflow run:** ${RUN_URL}"
            echo "- **Timestamp:** ${TIMESTAMP}"
            echo "- **Date checked:** ${CHECK_DATE}"
            echo "- **Check script:** \`scripts/cc-dual-run-diff.py\`"
            echo "- **Parent issue:** #2601 (CC portal migration)"
            echo ""
            echo "### Next Steps"
            echo ""
            echo "1. Verify the portal scraper is running:"
            echo "   \`scripts/ecs-logs.sh /ecs/judgemind-scraper-ca-cc-tentatives-portal-dev --lines 200\`"
            echo "2. Check the retired scraper logs for comparison:"
            echo "   \`scripts/ecs-logs.sh /ecs/judgemind-scraper-ca-cc-tentatives-dev --lines 200\`"
            echo "3. Visit contracosta.courts.ca.gov for the missing departments"
            echo "   to confirm rulings were posted that day."
            echo "4. If the portal genuinely missed them, file a \`priority/p1\`"
            echo "   bug against \`ca-cc-tentatives-portal\`."
            echo ""
            echo "This issue was created automatically by the CC dual-run diff"
            echo "workflow. It will not create duplicates while this issue is open."
          } > /tmp/issue_body.md

          ISSUE_URL=$(gh issue create \
            --repo "${{ github.repository }}" \
            --title "CC portal scraper missing departments on ${CHECK_DATE}" \
            --body-file /tmp/issue_body.md \
            --label "priority/p1,area/scraping,cc-dual-run-alert,agent/ready")

          echo "issue_url=$ISSUE_URL" >> "$GITHUB_OUTPUT"
          echo "created=true" >> "$GITHUB_OUTPUT"

      - name: Send Telegram notification
        if: steps.create-issue.outputs.created == 'true'
        continue-on-error: true
        run: |
          ISSUE_URL="${{ steps.create-issue.outputs.issue_url }}"
          ISSUE_NUM="${ISSUE_URL##*/}"
          TG_SUMMARY=$(cat /tmp/alert_telegram.txt 2>/dev/null || echo "Alert details unavailable.")

          {
            echo "<b>CC Dual-Run Diff Alert</b>"
            echo ""
            echo "${TG_SUMMARY}"
            echo ""
            echo "Issue #${ISSUE_NUM}: ${ISSUE_URL}"
          } > /tmp/tg_message.txt

          scripts/notify-telegram.sh --message-file /tmp/tg_message.txt

      - name: Update existing issue with new failures
        if: >-
          steps.check.outputs.healthy == 'false' &&
          steps.existing.outputs.exists == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUM: ${{ steps.existing.outputs.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          CHECK_DATE: ${{ steps.args.outputs.check_date }}
        run: |
          TIMESTAMP=$(date -u +%Y-%m-%dT%H:%M:%SZ)

          {
            echo "### Update: still in breach at ${TIMESTAMP} (date: ${CHECK_DATE})"
            echo ""
            cat /tmp/alert_summary.md
            echo ""
            echo ""
            echo "**Workflow run:** ${RUN_URL}"
          } > /tmp/comment_body.md

          gh issue comment "$ISSUE_NUM" \
            --repo "${{ github.repository }}" \
            --body-file /tmp/comment_body.md

      - name: Auto-close resolved cc-dual-run-alert issues
        if: steps.check.outputs.healthy == 'true'
        # Best-effort cleanup — a transient gh-API 5xx must not fail the
        # whole workflow run when the actual diff check has already passed.
        # See #4234 / #4238 / #4241.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          CHECK_DATE: ${{ steps.args.outputs.check_date }}
        run: |
          ISSUES=$(gh issue list \
            --repo "${{ github.repository }}" \
            --state open \
            --label "cc-dual-run-alert" \
            --json number \
            -q '.[].number')

          if [ -z "$ISSUES" ]; then
            echo "No open cc-dual-run-alert issues to close."
            exit 0
          fi

          for ISSUE_NUM in $ISSUES; do
            echo "Closing issue #${ISSUE_NUM} — no active diff breach on ${CHECK_DATE}."

            {
              echo "Portal scraper now matches retired scraper coverage for all departments on ${CHECK_DATE}. Auto-closing."
              echo ""
              echo "**Passing workflow run:** ${RUN_URL}"
            } > /tmp/close_comment.md

            gh issue comment "$ISSUE_NUM" \
              --repo "${{ github.repository }}" \
              --body-file /tmp/close_comment.md

            gh issue close "$ISSUE_NUM" \
              --repo "${{ github.repository }}" \
              --reason completed
          done
