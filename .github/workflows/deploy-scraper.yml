name: Deploy Scraper

on:
  push:
    branches: [main]
    paths:
      - "packages/scraper-framework/**"
      - ".github/workflows/deploy-scraper.yml"
      - ".github/actions/ecs-deploy/**"
      # scripts/wait-for-rollout.sh is invoked by the ecs-deploy composite
      # action. Changes to the shared script must trigger this deploy so the
      # fix is exercised against a real rollout on its own PR (see #2592).
      - "scripts/wait-for-rollout.sh"
      # scripts/ecs-post-deploy-healthcheck.sh is invoked by the
      # post-deploy-health-check job below. Same paths-filter contract as
      # wait-for-rollout.sh — changes to the shared health-check script
      # must trigger this deploy so regressions surface on the PR that
      # introduces them, not on the next unrelated deploy (see #2608/#2592).
      - "scripts/ecs-post-deploy-healthcheck.sh"
      # scripts/check-ingestion-worker-task-def-fingerprint.sh is invoked
      # by the post-deploy-health-check job's drift gate (#4044). Same
      # paths-filter contract as wait-for-rollout.sh / ecs-post-deploy-healthcheck.sh
      # — a regression in the canonicalize() filter (e.g. #4057) would
      # otherwise only surface on the next *unrelated* scraper PR's deploy,
      # blinding every scraper deploy's drift gate in the meantime
      # (see #4073/#2608/#2592).
      - "scripts/check-ingestion-worker-task-def-fingerprint.sh"
      # scripts/ecs-render-task-def.sh is invoked transitively by the
      # ecs-deploy composite action (.github/actions/ecs-deploy/action.yml).
      # Same shared-script convention — a regression there silently breaks
      # every scraper deploy's task-def render. See #4073.
      - "scripts/ecs-render-task-def.sh"
      # Oneshot scripts baked into the scraper image (#4255 Dockerfile
      # change). Without these on the path-filter, an edit to one of
      # these scripts ships as code-only without rebuilding the image
      # the EventBridge-scheduled tasks actually run.
      - "scripts/audit_scraper_field_population.py"
      - "scripts/check-scraper-zero-record-runner.py"
      - "scripts/check-scraper-zero-record-streak.py"
      - "scripts/notify-telegram.sh"
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Optional image tag (defaults to git SHA)"
        required: false
        type: string

concurrency:
  group: deploy-scraper-${{ github.ref }}
  cancel-in-progress: true

env:
  AWS_REGION: us-west-2
  ECR_REPOSITORY: judgemind/scraper
  ECS_CLUSTER: judgemind-dev
  TASK_FAMILY: judgemind-scraper-dev
  SCHEDULER_NAME: judgemind-scraper-dev
  CONTAINER_NAME: scraper
  # Terraform-managed source of truth for the per-court scraper task's
  # container_definitions. See #3770 / parent #2840 — without this, the
  # deploy-* path re-registers the running task-def's content and silently
  # re-introduces fields terraform has removed. The parameter name follows
  # the convention defined in
  # `infra/terraform/modules/compute/main.tf::aws_ssm_parameter.scraper_container_definitions`.
  SCRAPER_CONTAINER_DEFS_SSM_PARAMETER: /judgemind/scraper/dev/container-definitions
  # Same source-of-truth pattern, ingestion-worker task. See
  # `infra/terraform/modules/compute/main.tf::aws_ssm_parameter.ingestion_worker_container_definitions`.
  INGESTION_WORKER_CONTAINER_DEFS_SSM_PARAMETER: /judgemind/ingestion-worker/dev/container-definitions

jobs:
  build-and-push:
    name: Build and Push to ECR
    runs-on: ubuntu-latest
    outputs:
      image_uri: ${{ steps.build.outputs.image_uri }}
      sha_tag: ${{ steps.build.outputs.sha_tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Get AWS account ID
        id: aws-account
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          echo "id=$ACCOUNT_ID" >> "$GITHUB_OUTPUT"

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        id: build
        env:
          ECR_REGISTRY: ${{ steps.aws-account.outputs.id }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com
        run: |
          IMAGE_BASE="$ECR_REGISTRY/$ECR_REPOSITORY"
          SHA_TAG="${GITHUB_SHA::7}"
          BRANCH_TAG="${GITHUB_REF_NAME//\//-}"
          CUSTOM_TAG="${{ inputs.image_tag }}"

          TAGS=("-t" "$IMAGE_BASE:$SHA_TAG" "-t" "$IMAGE_BASE:latest" "-t" "$IMAGE_BASE:$BRANCH_TAG")

          if [ -n "$CUSTOM_TAG" ]; then
            TAGS+=("-t" "$IMAGE_BASE:$CUSTOM_TAG")
          fi

          docker build "${TAGS[@]}" -f packages/scraper-framework/Dockerfile .
          # Retry once on ECR name-unknown race (issue #3920, ref #3886/#3915):
          # A same-PR Terraform apply may create the ECR repo moments before this push runs.
          PUSH_OUTPUT=$(docker push "$IMAGE_BASE" --all-tags 2>&1) && RC=0 || RC=$?
          if [ $RC -ne 0 ]; then
            if echo "$PUSH_OUTPUT" | grep -qE "name unknown|repository .+ does not exist"; then
              echo "ECR repository not yet available; sleeping 60s before retry (issue #3920)" | tee -a "$GITHUB_STEP_SUMMARY"
              sleep 60
              docker push "$IMAGE_BASE" --all-tags
              echo "ECR retry succeeded — race condition resolved (issue #3920)" | tee -a "$GITHUB_STEP_SUMMARY"
            else
              echo "$PUSH_OUTPUT" >&2
              exit $RC
            fi
          fi

          echo "image_uri=$IMAGE_BASE:$SHA_TAG" >> "$GITHUB_OUTPUT"
          echo "sha_tag=$SHA_TAG" >> "$GITHUB_OUTPUT"

  deploy-staging:
    name: Deploy to Staging (dev)
    needs: build-and-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Checkout (for composite action)
        uses: actions/checkout@v6

      - name: Set pending deployment status
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -s -X POST \
            -H "Authorization: token $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/statuses/${{ github.sha }}" \
            -d '{
              "state": "pending",
              "description": "Deploying scraper to staging...",
              "context": "deploy/staging"
            }'

      - name: Deploy to ECS
        id: deploy
        uses: ./.github/actions/ecs-deploy
        with:
          task-family: ${{ env.TASK_FAMILY }}
          container-name: ${{ env.CONTAINER_NAME }}
          image-uri: ${{ needs.build-and-push.outputs.image_uri }}
          deploy-mode: scheduler
          scheduler-name: ${{ env.SCHEDULER_NAME }}
          desired-container-definitions-ssm-parameter: ${{ env.SCRAPER_CONTAINER_DEFS_SSM_PARAMETER }}

      - name: Set deployment status
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEPLOY_STATUS: ${{ job.status == 'success' && 'success' || 'failure' }}
          DEPLOY_DESC: ${{ job.status == 'success' && 'Scraper deployed to staging' || 'Staging deployment failed' }}
        run: |
          curl -s -X POST \
            -H "Authorization: token $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/statuses/${{ github.sha }}" \
            -d "{
              \"state\": \"$DEPLOY_STATUS\",
              \"description\": \"$DEPLOY_DESC\",
              \"context\": \"deploy/staging\"
            }"

  deploy-ingestion-worker:
    name: Deploy Ingestion Worker to Dev
    needs: build-and-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    env:
      INGESTION_TASK_FAMILY: judgemind-ingestion-worker-dev
      INGESTION_SERVICE: judgemind-ingestion-worker-dev
      INGESTION_CONTAINER: ingestion-worker

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Checkout (for composite action)
        uses: actions/checkout@v6

      - name: Set pending deployment status
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -s -X POST \
            -H "Authorization: token $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/statuses/${{ github.sha }}" \
            -d '{
              "state": "pending",
              "description": "Deploying ingestion worker to dev...",
              "context": "deploy/ingestion-worker-dev"
            }'

      - name: Deploy to ECS
        id: deploy
        uses: ./.github/actions/ecs-deploy
        with:
          task-family: ${{ env.INGESTION_TASK_FAMILY }}
          container-name: ${{ env.INGESTION_CONTAINER }}
          image-uri: ${{ needs.build-and-push.outputs.image_uri }}
          deploy-mode: service
          ecs-cluster: ${{ env.ECS_CLUSTER }}
          ecs-service: ${{ env.INGESTION_SERVICE }}
          desired-container-definitions-ssm-parameter: ${{ env.INGESTION_WORKER_CONTAINER_DEFS_SSM_PARAMETER }}

      - name: Set deployment status
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEPLOY_STATUS: ${{ job.status == 'success' && 'success' || 'failure' }}
          DEPLOY_DESC: ${{ job.status == 'success' && 'Ingestion worker deployed to dev' || 'Ingestion worker dev deployment failed' }}
        run: |
          curl -s -X POST \
            -H "Authorization: token $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/statuses/${{ github.sha }}" \
            -d "{
              \"state\": \"$DEPLOY_STATUS\",
              \"description\": \"$DEPLOY_DESC\",
              \"context\": \"deploy/ingestion-worker-dev\"
            }"

  post-deploy-health-check:
    name: Post-Deploy Ingestion Worker Health Check
    needs: deploy-ingestion-worker
    if: always() && needs.deploy-ingestion-worker.result == 'success'
    runs-on: ubuntu-latest

    env:
      INGESTION_SERVICE: judgemind-ingestion-worker-dev
      INGESTION_CONTAINER: ingestion-worker

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Checkout (for post-deploy-healthcheck script)
        uses: actions/checkout@v6

      - name: Wait for new tasks to start
        run: |
          echo "Waiting 60 seconds for new ingestion worker task to fully start..."
          sleep 60

      # Post-deploy health check — delegates to the extracted, unit-tested
      # script at scripts/ecs-post-deploy-healthcheck.sh. The extraction
      # keeps the scale-to-zero rule (running==desired==0 treated as
      # healthy) codified in one place so drift like #2605 cannot recur.
      - name: Post-deploy ingestion worker health check
        id: healthcheck
        env:
          ECS_CLUSTER: ${{ env.ECS_CLUSTER }}
          INGESTION_SERVICE: ${{ env.INGESTION_SERVICE }}
          LOG_GROUP: /ecs/judgemind-ingestion-worker-dev
        run: bash scripts/ecs-post-deploy-healthcheck.sh

      # Drift gate (#4044): assert the running task-def's container_definitions
      # match the terraform-rendered SSM parameter. Closes the silent-drift
      # class where deploy-scraper races terraform.yml dev-apply, reads a
      # stale SSM parameter, and pins the service to a pre-apply revision
      # while terraform's intent lives in a strictly-newer revision the
      # service cannot pick up because of `lifecycle.ignore_changes =
      # [task_definition]` on the ECS service. Failing this step surfaces
      # the drift before stale env vars affect production-like dev traffic.
      - name: Verify ingestion-worker task-def matches terraform SSM (#4044)
        id: fingerprint
        env:
          ECS_CLUSTER: ${{ env.ECS_CLUSTER }}
          INGESTION_SERVICE: ${{ env.INGESTION_SERVICE }}
          INGESTION_CONTAINER: ${{ env.INGESTION_CONTAINER }}
          INGESTION_WORKER_CONTAINER_DEFS_SSM_PARAMETER: ${{ env.INGESTION_WORKER_CONTAINER_DEFS_SSM_PARAMETER }}
        run: |
          bash scripts/check-ingestion-worker-task-def-fingerprint.sh \
            --cluster "$ECS_CLUSTER" \
            --service "$INGESTION_SERVICE" \
            --container-name "$INGESTION_CONTAINER" \
            --ssm-parameter "$INGESTION_WORKER_CONTAINER_DEFS_SSM_PARAMETER"

      - name: Set health check status
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEALTH_STATUS: ${{ steps.healthcheck.outcome == 'success' && 'success' || 'failure' }}
          HEALTH_DESC: ${{ steps.healthcheck.outcome == 'success' && 'Ingestion worker health check passed' || 'Ingestion worker health check failed' }}
        run: |
          curl -s -X POST \
            -H "Authorization: token $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/statuses/${{ github.sha }}" \
            -d "{
              \"state\": \"$HEALTH_STATUS\",
              \"description\": \"$HEALTH_DESC\",
              \"context\": \"deploy/ingestion-worker-dev-health\"
            }"
