name: CI

on:
  pull_request:
    branches: [main]
  # Push fires on all branches: main (for post-merge runs) and PR branches
  # (as a fallback when GitHub drops pull_request/synchronize events).
  # The concurrency group below deduplicates when both events fire.
  push:

# Cancel in-progress runs for the same branch/PR. When both push and
# pull_request events fire for the same commit, the second cancels the first
# so we never run duplicate CI.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      scraper: ${{ steps.changes.outputs.scraper }}
      scraper-framework: ${{ steps.changes.outputs.scraper-framework }}
      scraper-courts: ${{ steps.changes.outputs.scraper-courts }}
      nlp: ${{ steps.changes.outputs.nlp }}
      api: ${{ steps.changes.outputs.api }}
      web: ${{ steps.changes.outputs.web }}
      infra: ${{ steps.changes.outputs.infra }}
      scripts: ${{ steps.changes.outputs.scripts }}
      ecs-oneshot: ${{ steps.changes.outputs.ecs-oneshot }}
      dockerfile: ${{ steps.changes.outputs.dockerfile }}
      migrations: ${{ steps.changes.outputs.migrations }}
      schema: ${{ steps.changes.outputs.schema }}
      hooks: ${{ steps.changes.outputs.hooks }}
      githooks: ${{ steps.changes.outputs.githooks }}
      any-testable: ${{ steps.any-testable.outputs.result }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v4
        id: changes
        with:
          filters: |
            config:
              - 'packages/judgemind-config/**'
            scraper:
              - 'packages/scraper-framework/**'
              - 'packages/judgemind-config/**'
            scraper-framework:
              - 'packages/scraper-framework/src/framework/**'
              - 'packages/scraper-framework/src/ingestion/**'
              - 'packages/scraper-framework/src/templates/**'
              - 'packages/scraper-framework/src/validation/**'
              - 'packages/scraper-framework/tests/**'
              - 'packages/scraper-framework/pyproject.toml'
              - 'packages/judgemind-config/**'
            scraper-courts:
              - 'packages/scraper-framework/src/courts/**'
              - 'packages/scraper-framework/tests/courts/**'
              - 'packages/scraper-framework/tests/conftest.py'
              - 'packages/scraper-framework/pyproject.toml'
              - 'packages/judgemind-config/**'
            nlp:
              - 'packages/nlp-pipeline/**'
              - 'packages/judgemind-config/**'
            api:
              - 'packages/api/**'
            web:
              - 'packages/web/**'
            infra:
              - 'infra/**'
            scripts:
              - 'scripts/**'
              # scripts/wait-for-rollout.sh is shared by the ecs-deploy
              # composite action AND scripts/ecs-redeploy.sh (see #2523).
              # Running scripts-tests on ecs-deploy changes ensures
              # test_wait_for_rollout.sh fires on PRs that touch only the
              # composite action (which still calls the shared script).
              - '.github/actions/ecs-deploy/**'
              # Also trigger when the scripts-tests job itself changes, so
              # regressions in the auto-discovery loop are caught on the
              # PR that introduces them (#2505). Mirrors the 'hooks' filter
              # below which does the same for preflight-hook-test.
              - '.github/workflows/ci.yml'
            ecs-oneshot:
              - 'scripts/*.py'
              - 'scripts/ecs-run-task.sh'
              - 'packages/scraper-framework/Dockerfile'
              - 'packages/scraper-framework/pyproject.toml'
              - '.github/ecs-oneshot-test/**'
            dockerfile:
              - 'packages/scraper-framework/Dockerfile'
              - '.github/playwright-browser-check/**'
            migrations:
              - 'packages/api/migrations/**'
            schema:
              - 'packages/api/migrations/**'
              - 'packages/api/src/data-access/schema.sql'
            hooks:
              - '.claude/hooks/**'
              # Also trigger when the preflight-hook-test job itself changes,
              # so regressions in the auto-discovery loop are caught on the
              # PR that introduces them (#2410).
              - '.github/workflows/ci.yml'
            githooks:
              - '.githooks/**'
              - 'scripts/tests/test_pre_push.sh'
              - '.github/workflows/ci.yml'
      - name: Check if any coverage-producing package changed
        id: any-testable
        run: |
          if [ "${{ steps.changes.outputs.scraper }}" = "true" ] || \
             [ "${{ steps.changes.outputs.nlp }}" = "true" ] || \
             [ "${{ steps.changes.outputs.api }}" = "true" ] || \
             [ "${{ steps.changes.outputs.web }}" = "true" ]; then
            echo "result=true" >> "$GITHUB_OUTPUT"
          else
            echo "result=false" >> "$GITHUB_OUTPUT"
          fi

  scraper-framework-tests:
    needs: detect-changes
    if: needs.detect-changes.outputs.scraper-framework == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/scraper-framework
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        id: setup-python
        with:
          python-version: '3.12'
      - uses: actions/cache@v5
        id: venv-cache
        with:
          path: packages/scraper-framework/.venv
          key: venv-scraper-${{ runner.os }}-py${{ steps.setup-python.outputs.python-version }}-${{ hashFiles('packages/scraper-framework/pyproject.toml') }}
      - name: Validate cached venv
        if: steps.venv-cache.outputs.cache-hit == 'true'
        run: |
          if ! .venv/bin/python --version > /dev/null 2>&1; then
            echo "Cached venv is invalid (Python version mismatch), recreating..."
            rm -rf .venv
            echo "venv-invalid=true" >> "$GITHUB_ENV"
          fi
      - name: Install dependencies
        if: steps.venv-cache.outputs.cache-hit != 'true' || env.venv-invalid == 'true'
        run: |
          python -m venv .venv
          .venv/bin/pip install -e ../../packages/judgemind-config
          .venv/bin/pip install -e ".[dev]"
      - name: Lint
        run: .venv/bin/ruff check src/ tests/
      - name: Format check
        run: .venv/bin/ruff format --check src/ tests/
      - name: Test
        run: >-
          .venv/bin/pytest tests/ -n auto -v --tb=short --durations=30
          --ignore=tests/courts/
          --ignore=tests/test_reingest_from_s3.py
          --ignore=tests/test_reingest_registry.py
          --ignore=tests/test_ingestion.py
          --ignore=tests/test_extract.py
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-scraper-framework
          path: packages/scraper-framework/coverage.xml
      - name: Upload to Codecov
        if: always() && hashFiles('packages/scraper-framework/coverage.xml') != ''
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: packages/scraper-framework/coverage.xml
          flags: scraper-framework
          fail_ci_if_error: false

  scraper-court-tests:
    needs: detect-changes
    if: needs.detect-changes.outputs.scraper-courts == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Shard 1: PDF-heavy courts (CC, Fresno, OC variants, PDF link scraper,
          # Riverside, Santa Barbara). These tests involve PDF parsing and are
          # individually slower.
          - shard: 1
            test-paths: >-
              tests/courts/test_cc_tentatives.py
              tests/courts/test_fresno_tentatives.py
              tests/courts/test_oc_tentatives.py
              tests/courts/test_oc_family_law_tentatives.py
              tests/courts/test_oc_probate_tentatives.py
              tests/courts/test_pdf_link_scraper.py
              tests/courts/test_riverside_tentatives.py
              tests/courts/test_riverside_dept_judges.py
              tests/courts/test_sb_tentatives.py
              tests/courts/test_sb_dept_judges.py
              tests/courts/test_sf_dept_judges.py
          # Shard 2: HTML-based and other courts (CourtListener, LA, Santa Cruz,
          # San Diego, SF, Ventura, plus utility and roster tests).
          - shard: 2
            test-paths: >-
              tests/courts/test_ballotpedia.py
              tests/courts/test_courtlistener.py
              tests/courts/test_fresno_dept_judges.py
              tests/courts/test_governor_appointments.py
              tests/courts/test_kern_dept_judges.py
              tests/courts/test_la_tentatives.py
              tests/courts/test_la_dept_judges.py
              tests/courts/test_oc_dept_judges.py
              tests/courts/ca/
              tests/courts/test_sc_tentatives.py
              tests/courts/test_sd_tentatives.py
              tests/courts/test_sd_calendar.py
              tests/courts/test_sd_dept_judges.py
              tests/courts/test_sd_pipeline.py
              tests/courts/test_sf_civil_tentatives.py
              tests/courts/test_sf_tentatives.py
              tests/courts/test_ventura_tentatives.py
              tests/courts/test_ventura_dept_judges.py
    defaults:
      run:
        working-directory: packages/scraper-framework
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        id: setup-python
        with:
          python-version: '3.12'
      - uses: actions/cache@v5
        id: venv-cache
        with:
          path: packages/scraper-framework/.venv
          key: venv-scraper-${{ runner.os }}-py${{ steps.setup-python.outputs.python-version }}-${{ hashFiles('packages/scraper-framework/pyproject.toml') }}
      - name: Validate cached venv
        if: steps.venv-cache.outputs.cache-hit == 'true'
        run: |
          if ! .venv/bin/python --version > /dev/null 2>&1; then
            echo "Cached venv is invalid (Python version mismatch), recreating..."
            rm -rf .venv
            echo "venv-invalid=true" >> "$GITHUB_ENV"
          fi
      - name: Install dependencies
        if: steps.venv-cache.outputs.cache-hit != 'true' || env.venv-invalid == 'true'
        run: |
          python -m venv .venv
          .venv/bin/pip install -e ../../packages/judgemind-config
          .venv/bin/pip install -e ".[dev]"
      - name: Lint
        if: matrix.shard == 1
        run: .venv/bin/ruff check src/ tests/
      - name: Format check
        if: matrix.shard == 1
        run: .venv/bin/ruff format --check src/ tests/
      - name: Test
        run: >-
          .venv/bin/pytest ${{ matrix.test-paths }}
          -n auto -v --tb=short --durations=30
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-scraper-courts-${{ matrix.shard }}
          path: packages/scraper-framework/coverage.xml
      - name: Upload to Codecov
        if: always() && hashFiles('packages/scraper-framework/coverage.xml') != ''
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: packages/scraper-framework/coverage.xml
          flags: scraper-courts-${{ matrix.shard }}
          fail_ci_if_error: false

  ingestion-tests:
    needs: detect-changes
    if: needs.detect-changes.outputs.scraper == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/scraper-framework
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        id: setup-python
        with:
          python-version: '3.12'
      - uses: actions/cache@v5
        id: venv-cache
        with:
          path: packages/scraper-framework/.venv
          key: venv-scraper-${{ runner.os }}-py${{ steps.setup-python.outputs.python-version }}-${{ hashFiles('packages/scraper-framework/pyproject.toml') }}
      - name: Validate cached venv
        if: steps.venv-cache.outputs.cache-hit == 'true'
        run: |
          if ! .venv/bin/python --version > /dev/null 2>&1; then
            echo "Cached venv is invalid (Python version mismatch), recreating..."
            rm -rf .venv
            echo "venv-invalid=true" >> "$GITHUB_ENV"
          fi
      - name: Install dependencies
        if: steps.venv-cache.outputs.cache-hit != 'true' || env.venv-invalid == 'true'
        run: |
          python -m venv .venv
          .venv/bin/pip install -e ../../packages/judgemind-config
          .venv/bin/pip install -e ".[dev]"
      - name: Test
        run: >-
          .venv/bin/pytest
          tests/test_reingest_from_s3.py
          tests/test_reingest_registry.py
          tests/test_ingestion.py
          tests/test_extract.py
          -n auto -v --tb=short --durations=30
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-scraper-ingestion
          path: packages/scraper-framework/coverage.xml
      - name: Upload to Codecov
        if: always() && hashFiles('packages/scraper-framework/coverage.xml') != ''
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: packages/scraper-framework/coverage.xml
          flags: scraper-ingestion
          fail_ci_if_error: false

  nlp-tests:
    needs: detect-changes
    if: needs.detect-changes.outputs.nlp == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/nlp-pipeline
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        id: setup-python
        with:
          python-version: '3.12'
      - uses: actions/cache@v5
        id: venv-cache
        with:
          path: packages/nlp-pipeline/.venv
          key: venv-nlp-${{ runner.os }}-py${{ steps.setup-python.outputs.python-version }}-${{ hashFiles('packages/nlp-pipeline/pyproject.toml') }}
      - name: Validate cached venv
        if: steps.venv-cache.outputs.cache-hit == 'true'
        run: |
          if ! .venv/bin/python --version > /dev/null 2>&1; then
            echo "Cached venv is invalid (Python version mismatch), recreating..."
            rm -rf .venv
            echo "venv-invalid=true" >> "$GITHUB_ENV"
          fi
      - name: Install dependencies
        if: steps.venv-cache.outputs.cache-hit != 'true' || env.venv-invalid == 'true'
        run: |
          python -m venv .venv
          .venv/bin/pip install -e ../../packages/judgemind-config
          .venv/bin/pip install -e ".[dev]"
      - name: Lint
        run: .venv/bin/ruff check src/ tests/
      - name: Format check
        run: .venv/bin/ruff format --check src/ tests/
      - name: Test
        run: .venv/bin/pytest tests/ -v --tb=short
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-nlp
          path: packages/nlp-pipeline/coverage.xml
      - name: Upload to Codecov
        if: always() && hashFiles('packages/nlp-pipeline/coverage.xml') != ''
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: packages/nlp-pipeline/coverage.xml
          flags: nlp
          fail_ci_if_error: false

  api-tests:
    needs: detect-changes
    if: needs.detect-changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/api
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: judgemind
          POSTGRES_PASSWORD: localdev
          POSTGRES_DB: judgemind
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      opensearch:
        image: opensearchproject/opensearch:2.12.0
        env:
          discovery.type: single-node
          DISABLE_SECURITY_PLUGIN: "true"
          OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
        ports:
          - 9200:9200
        options: >-
          --health-cmd "curl -sf http://localhost:9200/_cluster/health || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://judgemind:localdev@localhost:5432/judgemind
      OPENSEARCH_URL: http://localhost:9200
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm ci
      - name: Run database migrations
        run: npm run db:migrate
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Test
        run: npx vitest run --coverage --passWithNoTests
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-api
          path: packages/api/coverage/lcov.info
      - name: Upload to Codecov
        if: always() && hashFiles('packages/api/coverage/lcov.info') != ''
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: packages/api/coverage/lcov.info
          flags: api
          fail_ci_if_error: false

  web-tests:
    needs: detect-changes
    if: needs.detect-changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/web
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Test
        run: npx vitest run --coverage --passWithNoTests
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-web
          path: packages/web/coverage/lcov.info
      - name: Upload to Codecov
        if: always() && hashFiles('packages/web/coverage/lcov.info') != ''
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: packages/web/coverage/lcov.info
          flags: web
          fail_ci_if_error: false
      - name: Build
        run: npm run build

  infra-validate:
    needs: detect-changes
    if: needs.detect-changes.outputs.infra == 'true'
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: us-west-2
      TF_IN_AUTOMATION: true
    steps:
      - uses: actions/checkout@v6
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: '1.7'
      - name: Terraform fmt check
        run: terraform fmt -check -recursive infra/terraform/

      # Validate each environment (no credentials needed)
      - name: Validate dev
        run: |
          terraform -chdir=infra/terraform/environments/dev init -backend=false
          terraform -chdir=infra/terraform/environments/dev validate
      - name: Validate production
        run: |
          terraform -chdir=infra/terraform/environments/production init -backend=false
          terraform -chdir=infra/terraform/environments/production validate

      # Plan with real backend to catch provider-specific attribute errors
      # (e.g. wrong resource attribute names that `validate` misses).
      # Skipped if AWS credentials are not configured.
      - name: Terraform Init (dev)
        if: env.AWS_ACCESS_KEY_ID != ''
        run: terraform -chdir=infra/terraform/environments/dev init
      - name: Terraform Plan (dev)
        if: env.AWS_ACCESS_KEY_ID != ''
        run: terraform -chdir=infra/terraform/environments/dev plan -no-color -input=false -lock=false

  scripts-tests:
    needs: detect-changes
    if: needs.detect-changes.outputs.scripts == 'true'
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: scripts
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Install test dependencies
        run: pip install pytest boto3 -e packages/judgemind-config
      - name: Install Node.js test dependencies
        run: npm install --no-save graphql@^16.8
      - name: Test
        run: pytest scripts/tests/ -v --tb=short
      - name: Check AWS CLI boolean flag usage
        run: scripts/check-aws-bool-flags.sh
      - name: Check for forbidden ECS services-stable waiter usage
        run: scripts/check-no-ecs-wait-services-stable.sh
      # Auto-discover and run every executable shell test under
      # scripts/tests/*.sh. Replaces the old per-script listing (#2505) so
      # that adding a new shell test is just `touch + chmod +x` — no
      # matching ci.yml edit required. Previously, three tests
      # (test_check_oneshot_imports.sh, test_ecs_logs.sh, test_preflight.sh)
      # were silently never running in CI because they'd never been added
      # to the list.
      #
      # SKIP_PATTERNS: tests that are expensive AND already covered by a
      # dedicated CI job with its own narrow path filter. Keeping them
      # here would mean running them twice whenever scripts/** changes.
      #
      #   test_pre_push.sh (~32s)  — dedicated job: githooks-pre-push-test
      #                              triggered by the `githooks` path
      #                              filter (.githooks/**, the test file
      #                              itself, and ci.yml). See #2536 for
      #                              the duration regression this skip
      #                              addresses (+34s, +112%).
      - name: Run all scripts/tests shell tests
        shell: bash
        env:
          # Whitespace-separated list of test paths to defer to their own
          # dedicated CI jobs. See the comment above this step for why.
          SKIP_TESTS: "scripts/tests/test_pre_push.sh"
        run: |
          set -uo pipefail
          shopt -s nullglob
          tests=(scripts/tests/*.sh)
          if [ ${#tests[@]} -eq 0 ]; then
            echo "No shell test files found under scripts/tests/ — nothing to run."
            exit 0
          fi
          # Returns 0 if $1 is listed in $SKIP_TESTS (whitespace-separated).
          is_skipped() {
            local target="$1"
            local entry
            for entry in $SKIP_TESTS; do
              if [ "$entry" = "$target" ]; then
                return 0
              fi
            done
            return 1
          }
          failed=0
          ran=0
          skipped=0
          deferred=0
          for t in "${tests[@]}"; do
            if is_skipped "$t"; then
              echo "::notice::Deferring $t — covered by a dedicated CI job"
              deferred=$((deferred + 1))
              continue
            fi
            if [ ! -x "$t" ]; then
              echo "::warning::Skipping $t — not executable (chmod +x required)"
              skipped=$((skipped + 1))
              continue
            fi
            echo "::group::$t"
            if ! "$t"; then
              echo "::error::$t failed"
              failed=$((failed + 1))
            fi
            ran=$((ran + 1))
            echo "::endgroup::"
          done
          echo "Ran $ran shell test(s). Skipped (not executable): $skipped. Deferred to dedicated jobs: $deferred. Failed: $failed."
          if [ "$failed" -gt 0 ]; then
            echo "::error::$failed shell test(s) failed."
            exit 1
          fi

  # ---------------------------------------------------------------
  # Coverage gates: diff coverage (new lines) + overall floor ratchet
  # ---------------------------------------------------------------
  coverage-check:
    needs: [detect-changes, scraper-framework-tests, scraper-court-tests, ingestion-tests, nlp-tests, api-tests, web-tests]
    if: always() && github.event_name == 'pull_request' && needs.detect-changes.outputs.any-testable == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install diff-cover
        run: pip install diff-cover

      # Download all coverage artifacts (each upload is optional — packages
      # that were skipped or had no tests will simply be missing).
      - uses: actions/download-artifact@v8
        with:
          pattern: coverage-*
          path: coverage-artifacts/
          merge-multiple: false

      - name: List downloaded artifacts
        run: find coverage-artifacts/ -type f 2>/dev/null || echo "No artifacts"

      # --- Diff coverage checks (new/changed lines must be >= 90% covered) ---

      - name: Diff coverage — scraper-framework
        if: needs.detect-changes.outputs.scraper == 'true'
        run: |
          COV_FRAMEWORK="coverage-artifacts/coverage-scraper-framework/coverage.xml"
          COV_COURTS_1="coverage-artifacts/coverage-scraper-courts-1/coverage.xml"
          COV_COURTS_2="coverage-artifacts/coverage-scraper-courts-2/coverage.xml"
          COV_INGEST="coverage-artifacts/coverage-scraper-ingestion/coverage.xml"
          COV_FILES=""
          for f in "$COV_FRAMEWORK" "$COV_COURTS_1" "$COV_COURTS_2" "$COV_INGEST"; do
            if [ -f "$f" ]; then COV_FILES="$COV_FILES $f"; fi
          done
          if [ -n "$COV_FILES" ]; then
            diff-cover $COV_FILES --compare-branch=origin/main --fail-under=90 --diff-range-notation='..'
          else
            echo "No coverage artifact for scraper-framework — skipping diff-cover"
          fi

      - name: Diff coverage — nlp-pipeline
        if: needs.detect-changes.outputs.nlp == 'true'
        run: |
          COV_FILE="coverage-artifacts/coverage-nlp/coverage.xml"
          if [ -f "$COV_FILE" ]; then
            diff-cover "$COV_FILE" --compare-branch=origin/main --fail-under=90 --diff-range-notation='..'
          else
            echo "No coverage artifact for nlp-pipeline — skipping diff-cover"
          fi

      - name: Diff coverage — api
        if: needs.detect-changes.outputs.api == 'true'
        run: |
          COV_FILE="coverage-artifacts/coverage-api/lcov.info"
          if [ -f "$COV_FILE" ]; then
            diff-cover "$COV_FILE" --compare-branch=origin/main --fail-under=90 --diff-range-notation='..'
          else
            echo "No coverage artifact for api — skipping diff-cover"
          fi

      - name: Diff coverage — web
        if: needs.detect-changes.outputs.web == 'true'
        run: |
          COV_FILE="coverage-artifacts/coverage-web/lcov.info"
          if [ -f "$COV_FILE" ]; then
            diff-cover "$COV_FILE" --compare-branch=origin/main --fail-under=90 --diff-range-notation='..'
          else
            echo "No coverage artifact for web — skipping diff-cover"
          fi

      # --- Overall coverage floor ratchet ---
      # Fails if any package's coverage dropped below its baseline.

      - name: Coverage floor ratchet — scraper-framework
        if: needs.detect-changes.outputs.scraper == 'true'
        run: |
          # Merge coverage from all split scraper test jobs (framework,
          # court shard 1, court shard 2, ingestion).
          # Uses separate baselines for partial vs full runs:
          #   - "packages/scraper-framework" (combined) when ALL three test
          #     jobs (framework, courts, ingestion) produced coverage
          #   - "packages/scraper-framework:framework-only" (partial) when
          #     any test job was skipped (e.g. courts-only or
          #     framework-only changes)
          COV_ARGS=""
          COV_FRAMEWORK="coverage-artifacts/coverage-scraper-framework/coverage.xml"
          COV_COURTS_1="coverage-artifacts/coverage-scraper-courts-1/coverage.xml"
          COV_COURTS_2="coverage-artifacts/coverage-scraper-courts-2/coverage.xml"
          COV_INGEST="coverage-artifacts/coverage-scraper-ingestion/coverage.xml"
          HAS_ANY=false
          HAS_COURTS=false
          for f in "$COV_FRAMEWORK" "$COV_COURTS_1" "$COV_COURTS_2" "$COV_INGEST"; do
            if [ -f "$f" ]; then
              COV_ARGS="$COV_ARGS --coverage-file $f"
              HAS_ANY=true
            fi
          done
          # Check if either court shard produced coverage
          if [ -f "$COV_COURTS_1" ] || [ -f "$COV_COURTS_2" ]; then
            HAS_COURTS=true
          fi
          if [ "$HAS_ANY" = "false" ]; then
            echo "No coverage artifacts found — skipping floor ratchet"
            exit 0
          fi
          if [ "$HAS_COURTS" = "false" ] && [ ! -f "$COV_FRAMEWORK" ]; then
            echo "Neither framework nor court coverage available — skipping"
            exit 0
          fi
          # Choose baseline key based on which test jobs ran.
          # Use the combined (strict) baseline only when ALL three test
          # jobs produced coverage artifacts.  If any job was skipped
          # (e.g. courts-only or framework-only changes), use the
          # partial baseline to avoid false failures.
          BASELINE_KEY="packages/scraper-framework"
          if [ -f "$COV_FRAMEWORK" ] && [ "$HAS_COURTS" = "true" ] && [ -f "$COV_INGEST" ]; then
            echo "All test jobs ran — enforcing combined baseline"
          else
            BASELINE_KEY="packages/scraper-framework:framework-only"
            echo "Partial test run (not all jobs produced coverage) — enforcing partial baseline"
          fi
          python scripts/update-coverage-baselines.py \
            --package packages/scraper-framework \
            --baseline-key "$BASELINE_KEY" \
            $COV_ARGS \
            --dry-run

      - name: Coverage floor ratchet — nlp-pipeline
        if: needs.detect-changes.outputs.nlp == 'true'
        run: |
          COV_FILE="coverage-artifacts/coverage-nlp/coverage.xml"
          if [ -f "$COV_FILE" ]; then
            python scripts/update-coverage-baselines.py \
              --package packages/nlp-pipeline \
              --coverage-file "$COV_FILE" \
              --dry-run
          fi

      - name: Coverage floor ratchet — api
        if: needs.detect-changes.outputs.api == 'true'
        run: |
          COV_FILE="coverage-artifacts/coverage-api/lcov.info"
          if [ -f "$COV_FILE" ]; then
            python scripts/update-coverage-baselines.py \
              --package packages/api \
              --coverage-file "$COV_FILE" \
              --dry-run
          fi

      - name: Coverage floor ratchet — web
        if: needs.detect-changes.outputs.web == 'true'
        run: |
          COV_FILE="coverage-artifacts/coverage-web/lcov.info"
          if [ -f "$COV_FILE" ]; then
            python scripts/update-coverage-baselines.py \
              --package packages/web \
              --coverage-file "$COV_FILE" \
              --dry-run
          fi

  # ---------------------------------------------------------------
  # Data quality baselines structural validation
  # ---------------------------------------------------------------
  dq-baselines-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Validate data-quality-baselines.json
        run: python scripts/validate-dq-baselines.py

  # ---------------------------------------------------------------
  # Deprecated model guard: prevent use of deprecated Anthropic models
  # ---------------------------------------------------------------
  deprecated-models-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check for deprecated Anthropic model identifiers
        run: scripts/check-deprecated-models.sh

  # ---------------------------------------------------------------
  # Hardcoded model guard: enforce model ID centralization
  # ---------------------------------------------------------------
  hardcoded-models-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check for hardcoded Claude model identifiers
        run: scripts/check-hardcoded-models.sh

  # ---------------------------------------------------------------
  # Hardcoded color guard: enforce semantic design tokens in TSX
  # ---------------------------------------------------------------
  hardcoded-colors-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check for hardcoded Tailwind color classes in TSX
        run: scripts/check-hardcoded-colors.sh

  # ---------------------------------------------------------------
  # Schema drift guard: schema.sql must match applied migrations
  # ---------------------------------------------------------------
  schema-drift-check:
    needs: detect-changes
    if: needs.detect-changes.outputs.schema == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check schema.sql matches migrations
        run: scripts/check_schema_drift.sh --ci

  # ---------------------------------------------------------------
  # Migration file guard: validate naming and sequencing
  # ---------------------------------------------------------------
  migration-files-check:
    needs: detect-changes
    if: needs.detect-changes.outputs.migrations == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Validate migration file naming and sequencing
        run: scripts/check-migration-files.sh

  # ---------------------------------------------------------------
  # ECS oneshot import guard: prevent scripts/ from importing siblings
  # ---------------------------------------------------------------
  oneshot-imports-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check for sibling imports in oneshot scripts
        run: scripts/check-oneshot-imports.sh

  # ---------------------------------------------------------------
  # ECS oneshot repo-path guard: flag scripts that use REPO_ROOT
  # without a validated fallback for when the repo is unavailable (#1277)
  # ---------------------------------------------------------------
  oneshot-repo-paths-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check for unvalidated REPO_ROOT references in oneshot scripts
        run: scripts/check-oneshot-repo-paths.sh

  # ---------------------------------------------------------------
  # Duplicate function guard: detect shadowed function definitions
  # ---------------------------------------------------------------
  duplicate-functions-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check for duplicate function definitions in Python
        run: scripts/check-duplicate-functions.sh

  # ---------------------------------------------------------------
  # Test swallow guard: forbid `try/except Exception: pass` in test
  # files — prevents a class of silent test regression where the
  # call under test is wrapped in a blind swallow (#2443, #2459).
  # ---------------------------------------------------------------
  test-except-pass-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: "Forbid `try/except Exception: pass` in test files"
        run: scripts/check-test-except-pass.sh

  # ---------------------------------------------------------------
  # Markdown link guard: internal .md pointers in CLAUDE.md, docs/,
  # .claude/skills/, packages/*/README.md, packages/*/docs/,
  # infra/, and .github/ must point to files that exist (#2425, #2428)
  # ---------------------------------------------------------------
  markdown-links-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check for broken markdown pointers
        run: scripts/check-markdown-links.sh

  # ---------------------------------------------------------------
  # SQL ON CONFLICT target validation: verify conflict targets match schema
  # ---------------------------------------------------------------
  sql-conflict-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Validate ON CONFLICT targets against schema constraints
        run: python3 scripts/check-sql-conflicts.py

  # ---------------------------------------------------------------
  # SQL column reference validation: verify column references match schema
  # ---------------------------------------------------------------
  sql-column-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Validate SQL column references against schema definitions
        run: python3 scripts/check-sql-columns.py

  # ---------------------------------------------------------------
  # Shard coverage guard: all court test files listed in shard config
  # ---------------------------------------------------------------
  shard-coverage-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check all court test files are in shard config
        run: scripts/check-shard-coverage.sh

  # ---------------------------------------------------------------
  # Apollo keyFields guard: types without `id` need cache config
  # ---------------------------------------------------------------
  apollo-keyfields-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check GraphQL types without id have Apollo keyFields
        run: scripts/check-apollo-keyfields.sh

  # ---------------------------------------------------------------
  # GraphQL query validation: frontend queries must match API schema
  # ---------------------------------------------------------------
  graphql-query-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Install graphql package
        run: npm install --no-save graphql@^16.8
      - name: Validate frontend GraphQL queries against API schema
        run: scripts/check-graphql-queries.sh

  # ---------------------------------------------------------------
  # Scraper registry guard: all scraper modules must be registered in runner.py (#2132)
  # ---------------------------------------------------------------
  scraper-registry-check:
    needs: detect-changes
    if: needs.detect-changes.outputs.scraper == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check all scraper modules are registered in runner.py
        run: scripts/check-scraper-registry.sh

  # ---------------------------------------------------------------
  # Removed exports guard: detect broken imports from removed/renamed exports (#2001)
  # ---------------------------------------------------------------
  removed-exports-check:
    needs: detect-changes
    if: needs.detect-changes.outputs.scraper == 'true' || needs.detect-changes.outputs.nlp == 'true' || needs.detect-changes.outputs.api == 'true' || needs.detect-changes.outputs.scripts == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Check for broken imports from removed exports
        run: scripts/check-removed-exports.sh

  # ---------------------------------------------------------------
  # CI job-skipped guard: detect jobs whose body is modified on a PR
  # but would be SKIPPED on that PR's CI run because their paths-filter
  # if-gate doesn't match anything in the diff (#2410, #2505, #2527).
  # ---------------------------------------------------------------
  ci-job-skipped-check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Detect modified CI jobs that would be skipped on their own PR
        run: python3 scripts/check-ci-job-skipped.py --base "origin/${{ github.event.pull_request.base.ref }}"

  # ---------------------------------------------------------------
  # Preflight hook test suite: runs when .claude/hooks/ changes (#2408)
  # ---------------------------------------------------------------
  preflight-hook-test:
    needs: detect-changes
    if: needs.detect-changes.outputs.hooks == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Run hook test suites
        run: |
          set -euo pipefail
          shopt -s nullglob
          tests=(.claude/hooks/test_*.py)
          if [ ${#tests[@]} -eq 0 ]; then
            echo "No hook test files found under .claude/hooks/ — nothing to run."
            exit 0
          fi
          failed=0
          for t in "${tests[@]}"; do
            echo "::group::$t"
            if ! python3 "$t"; then
              failed=$((failed + 1))
            fi
            echo "::endgroup::"
          done
          if [ "$failed" -gt 0 ]; then
            echo "::error::$failed hook test suite(s) failed."
            exit 1
          fi
          echo "All ${#tests[@]} hook test suite(s) passed."

  # ---------------------------------------------------------------
  # Git pre-push hook integration tests (#2488).
  # Originally a regression guard for the #2487 stdin field-order bug;
  # #2488 expanded it into a full scenario suite (clean push, new/existing
  # branch detection, delete push, markdown-link rejection, WARNING paths
  # for missing ruff/actionlint/terraform).
  # ---------------------------------------------------------------
  githooks-pre-push-test:
    needs: detect-changes
    if: needs.detect-changes.outputs.githooks == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Run pre-push hook integration tests
        run: scripts/tests/test_pre_push.sh

  # ---------------------------------------------------------------
  # ECS oneshot Docker integration test: run scripts in a container
  # ---------------------------------------------------------------
  ecs-oneshot-test:
    needs: detect-changes
    if: needs.detect-changes.outputs.ecs-oneshot == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Run ECS oneshot integration tests
        run: .github/ecs-oneshot-test/run-tests.sh

  # ---------------------------------------------------------------
  # Playwright browser binary accessibility check (#1637)
  # Builds the scraper-framework Docker image and verifies the
  # non-root scraper user can resolve the Chromium binary path.
  # Catches regressions like #1625 before they reach production.
  # ---------------------------------------------------------------
  playwright-browser-check:
    needs: detect-changes
    if: needs.detect-changes.outputs.dockerfile == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - name: Build scraper-framework Docker image
        run: |
          docker build \
            -f packages/scraper-framework/Dockerfile \
            -t judgemind/scraper-framework:ci-test \
            .

      - name: Verify Playwright Chromium binary accessible as scraper user
        run: |
          docker run --rm \
            --entrypoint python3 \
            -v "$PWD/.github/playwright-browser-check/verify_browser.py:/tmp/verify_browser.py:ro" \
            judgemind/scraper-framework:ci-test \
            /tmp/verify_browser.py

  # ---------------------------------------------------------------
  # Migration notice: comment on PRs that include migration changes
  # ---------------------------------------------------------------
  migration-notice:
    needs: detect-changes
    if: github.event_name == 'pull_request' && needs.detect-changes.outputs.migrations == 'true'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Post migration notice
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          # Check if we already posted a migration notice on this PR
          EXISTING=$(curl -s \
            -H "Authorization: token $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/issues/${PR_NUMBER}/comments" \
            | jq '[.[] | select(.body | contains("database migration"))] | length')

          if [ "$EXISTING" -gt 0 ]; then
            echo "Migration notice already posted on this PR."
            exit 0
          fi

          curl -s -X POST \
            -H "Authorization: token $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/issues/${PR_NUMBER}/comments" \
            -d '{
              "body": "**Note:** This PR includes database migration changes. Migrations will be **auto-applied to the dev database** when this PR merges to main. Production migrations remain human-triggered.\n\nPlease ensure the migration is backwards-compatible with the current running code during the rollout window."
            }'

  # Always runs. Reports success only when every applicable job passed or was
  # skipped (path filter did not match). Branch protection requires this check.
  ci-passed:
    needs: [scraper-framework-tests, scraper-court-tests, ingestion-tests, nlp-tests, api-tests, web-tests, infra-validate, scripts-tests, coverage-check, deprecated-models-check, hardcoded-models-check, hardcoded-colors-check, oneshot-imports-check, oneshot-repo-paths-check, duplicate-functions-check, test-except-pass-check, markdown-links-check, schema-drift-check, dq-baselines-validate, ecs-oneshot-test, migration-files-check, sql-conflict-check, sql-column-check, playwright-browser-check, shard-coverage-check, apollo-keyfields-check, graphql-query-check, scraper-registry-check, preflight-hook-test, githooks-pre-push-test, ci-job-skipped-check]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check all jobs passed or were skipped
        run: |
          results='${{ toJSON(needs) }}'
          echo "Job results: $results"
          if echo "$results" | grep -q '"result": "failure"'; then
            echo "One or more jobs failed."
            exit 1
          fi
          echo "All jobs passed or were skipped."
