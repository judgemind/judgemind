name: CI

on:
  pull_request:
    branches: [main]
  # Push fires on all branches: main (for post-merge runs) and PR branches
  # (as a fallback when GitHub drops pull_request/synchronize events).
  # The concurrency group below deduplicates when both events fire.
  push:

# Cancel in-progress runs for the same branch/PR. When both push and
# pull_request events fire for the same commit, the second cancels the first
# so we never run duplicate CI.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      scraper: ${{ steps.changes.outputs.scraper }}
      scraper-framework: ${{ steps.changes.outputs.scraper-framework }}
      scraper-courts: ${{ steps.changes.outputs.scraper-courts }}
      nlp: ${{ steps.changes.outputs.nlp }}
      api: ${{ steps.changes.outputs.api }}
      web: ${{ steps.changes.outputs.web }}
      infra: ${{ steps.changes.outputs.infra }}
      scripts: ${{ steps.changes.outputs.scripts }}
      ecs-oneshot: ${{ steps.changes.outputs.ecs-oneshot }}
      dockerfile: ${{ steps.changes.outputs.dockerfile }}
      migrations: ${{ steps.changes.outputs.migrations }}
      schema: ${{ steps.changes.outputs.schema }}
      hooks: ${{ steps.changes.outputs.hooks }}
      githooks: ${{ steps.changes.outputs.githooks }}
      dispatcher-terminals: ${{ steps.changes.outputs.dispatcher-terminals }}
      dispatcher-image: ${{ steps.changes.outputs.dispatcher-image }}
      any-testable: ${{ steps.any-testable.outputs.result }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v4
        id: changes
        with:
          filters: |
            config:
              - 'packages/judgemind-config/**'
            scraper:
              - 'packages/scraper-framework/**'
              - 'packages/judgemind-config/**'
            scraper-framework:
              - 'packages/scraper-framework/src/framework/**'
              - 'packages/scraper-framework/src/ingestion/**'
              - 'packages/scraper-framework/src/validation/**'
              - 'packages/scraper-framework/tests/**'
              - 'packages/scraper-framework/pyproject.toml'
              - 'packages/judgemind-config/**'
            scraper-courts:
              - 'packages/scraper-framework/src/courts/**'
              - 'packages/scraper-framework/tests/courts/**'
              - 'packages/scraper-framework/tests/conftest.py'
              - 'packages/scraper-framework/pyproject.toml'
              - 'packages/judgemind-config/**'
            nlp:
              - 'packages/nlp-pipeline/**'
              - 'packages/judgemind-config/**'
            api:
              - 'packages/api/**'
              # Include ci.yml so that edits to the no-api-github-fetch-check
              # job are exercised on the PR that introduces them.
              # Without this, the paths filter makes the job SKIP on its own
              # PR — the #2410/#2505 footgun. See scripts/check-ci-job-skipped.py.
              - '.github/workflows/ci.yml'
            web:
              - 'packages/web/**'
            infra:
              - 'infra/**'
            scripts:
              - 'scripts/**'
              # scripts/wait-for-rollout.sh is shared by the ecs-deploy
              # composite action AND scripts/ecs-redeploy.sh (see #2523).
              # Running scripts-tests on ecs-deploy changes ensures
              # test_wait_for_rollout.sh fires on PRs that touch only the
              # composite action (which still calls the shared script).
              - '.github/actions/ecs-deploy/**'
              # Dockerfile.dispatcher is the image the dispatcher daemon
              # runs in; scripts-tests wires the check-dispatcher-image-deps
              # guard that cross-checks its pip install list against
              # scripts/dispatcher/**/*.py imports (#2776, motivated by
              # the #2773 boto3 scope miss). Running scripts-tests on
              # Dockerfile.dispatcher edits ensures that guard fires on
              # PRs that only touch the Dockerfile (e.g. adding a new
              # dep unrelated to a daemon code change).
              - 'Dockerfile.dispatcher'
              # Also trigger when the scripts-tests job itself changes, so
              # regressions in the auto-discovery loop are caught on the
              # PR that introduces them (#2505). Mirrors the 'hooks' filter
              # below which does the same for preflight-hook-test.
              - '.github/workflows/ci.yml'
              # scripts/tests/test_task_v2_ralph_contract.py reads
              # .claude/skills/task-v2-ralph/SKILL.md and
              # .claude/skills/ralph/SKILL.md to assert the post-#2845
              # architectural contract (no change-type short-circuit,
              # non-testable branch present). Trigger scripts-tests on
              # any skill-file edit so the guard fires on PRs that
              # only touch .claude/skills/.
              - '.claude/skills/**'
            ecs-oneshot:
              - 'scripts/*.py'
              - 'scripts/ecs-run-task.sh'
              - 'packages/scraper-framework/Dockerfile'
              - 'packages/scraper-framework/pyproject.toml'
              - '.github/ecs-oneshot-test/**'
              - 'infra/terraform/modules/dispatcher-agent-runner/**'
              - 'infra/terraform/modules/dispatcher-daemon/**'
            dockerfile:
              - 'packages/scraper-framework/Dockerfile'
              - '.github/playwright-browser-check/**'
            migrations:
              - 'packages/api/migrations/**'
              # Include ci.yml so that edits to the migration-* jobs below
              # (migration-files-check, migration-collision-check,
              # schema-drift-check, migration-notice) are actually exercised
              # on the PR that introduces them. Without this, the paths
              # filter would make those jobs SKIP on their own PR — the
              # #2410 / #2505 footgun. See scripts/check-ci-job-skipped.py.
              - '.github/workflows/ci.yml'
            schema:
              - 'packages/api/migrations/**'
              - 'packages/api/src/data-access/schema.sql'
              - '.github/workflows/ci.yml'
            hooks:
              - '.claude/hooks/**'
              # Also trigger when the preflight-hook-test job itself changes,
              # so regressions in the auto-discovery loop are caught on the
              # PR that introduces them (#2410).
              - '.github/workflows/ci.yml'
            githooks:
              - '.githooks/**'
              - 'scripts/tests/test_pre_push.sh'
              - '.github/workflows/ci.yml'
            dispatcher-terminals:
              - 'scripts/dispatcher/daemon.py'
              - 'packages/api/src/graphql/dispatcher/**'
              - 'packages/web/src/app/**/admin/dispatcher/**'
              # Include ci.yml so that edits to the dispatcher-terminal-consistency-check
              # job are exercised on the PR that introduces them. Without this, the
              # paths filter makes the job SKIP on its own PR — the #2410/#2505
              # footgun. See scripts/check-ci-job-skipped.py.
              - '.github/workflows/ci.yml'
            dispatcher-image:
              - 'Dockerfile.dispatcher'
              # Include ci.yml so that edits to the dispatcher-image-version-check
              # job are exercised on the PR that introduces them. Without this, the
              # paths filter makes the job SKIP on its own PR — the #2410/#2505
              # footgun. See scripts/check-ci-job-skipped.py.
              - '.github/workflows/ci.yml'
      - name: Check if any coverage-producing package changed
        id: any-testable
        run: |
          if [ "${{ steps.changes.outputs.scraper }}" = "true" ] || \
             [ "${{ steps.changes.outputs.nlp }}" = "true" ] || \
             [ "${{ steps.changes.outputs.api }}" = "true" ] || \
             [ "${{ steps.changes.outputs.web }}" = "true" ]; then
            echo "result=true" >> "$GITHUB_OUTPUT"
          else
            echo "result=false" >> "$GITHUB_OUTPUT"
          fi

  scraper-framework-tests:
    needs: detect-changes
    if: needs.detect-changes.outputs.scraper-framework == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/scraper-framework
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        id: setup-python
        with:
          python-version: '3.12'
      - uses: actions/cache@v5
        id: venv-cache
        with:
          path: packages/scraper-framework/.venv
          key: venv-scraper-${{ runner.os }}-py${{ steps.setup-python.outputs.python-version }}-${{ hashFiles('packages/scraper-framework/pyproject.toml') }}
      - name: Validate cached venv
        if: steps.venv-cache.outputs.cache-hit == 'true'
        run: |
          if ! .venv/bin/python --version > /dev/null 2>&1; then
            echo "Cached venv is invalid (Python version mismatch), recreating..."
            rm -rf .venv
            echo "venv-invalid=true" >> "$GITHUB_ENV"
          fi
      - name: Install dependencies
        if: steps.venv-cache.outputs.cache-hit != 'true' || env.venv-invalid == 'true'
        run: |
          python -m venv .venv
          .venv/bin/pip install -e ../../packages/judgemind-config
          .venv/bin/pip install -e ".[dev]"
      - name: Lint
        run: .venv/bin/ruff check src/ tests/
      - name: Format check
        run: .venv/bin/ruff format --check src/ tests/
      - name: Test
        run: >-
          .venv/bin/pytest tests/ -n auto -v --tb=short --durations=30
          --ignore=tests/courts/
          --ignore=tests/test_reingest_from_s3.py
          --ignore=tests/test_reingest_registry.py
          --ignore=tests/test_ingestion.py
          --ignore=tests/test_extract.py
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-scraper-framework
          path: packages/scraper-framework/coverage.xml
      - name: Upload to Codecov
        if: always() && hashFiles('packages/scraper-framework/coverage.xml') != ''
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: packages/scraper-framework/coverage.xml
          flags: scraper-framework
          fail_ci_if_error: false

  scraper-court-tests:
    needs: detect-changes
    if: needs.detect-changes.outputs.scraper-courts == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Shard 1: PDF-heavy courts (CC, Fresno, OC variants, PDF link scraper,
          # Riverside, Santa Barbara). These tests involve PDF parsing and are
          # individually slower.
          - shard: 1
            test-paths: >-
              tests/courts/test_cc_tentatives.py
              tests/courts/test_cc_dept_judges.py
              tests/courts/test_fresno_tentatives.py
              tests/courts/test_oc_tentatives.py
              tests/courts/test_oc_family_law_tentatives.py
              tests/courts/test_oc_probate_tentatives.py
              tests/courts/test_pdf_link_scraper.py
              tests/courts/test_riverside_tentatives.py
              tests/courts/test_riverside_dept_judges.py
              tests/courts/test_sb_tentatives.py
              tests/courts/test_sb_dept_judges.py
              tests/courts/test_sf_dept_judges.py
          # Shard 2: HTML-based and other courts (CourtListener, LA, Santa Cruz,
          # San Diego, SF, Ventura, plus utility and roster tests).
          - shard: 2
            test-paths: >-
              tests/courts/test_ballotpedia.py
              tests/courts/test_courtlistener.py
              tests/courts/test_fresno_dept_judges.py
              tests/courts/test_governor_appointments.py
              tests/courts/test_kern_dept_judges.py
              tests/courts/test_la_tentatives.py
              tests/courts/test_la_dept_judges.py
              tests/courts/test_oc_dept_judges.py
              tests/courts/ca/
              tests/courts/test_sc_tentatives.py
              tests/courts/test_sd_tentatives.py
              tests/courts/test_sd_calendar.py
              tests/courts/test_sd_dept_judges.py
              tests/courts/test_sd_pipeline.py
              tests/courts/test_sf_civil_tentatives.py
              tests/courts/test_sf_tentatives.py
              tests/courts/test_ventura_tentatives.py
              tests/courts/test_ventura_dept_judges.py
    defaults:
      run:
        working-directory: packages/scraper-framework
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        id: setup-python
        with:
          python-version: '3.12'
      - uses: actions/cache@v5
        id: venv-cache
        with:
          path: packages/scraper-framework/.venv
          key: venv-scraper-${{ runner.os }}-py${{ steps.setup-python.outputs.python-version }}-${{ hashFiles('packages/scraper-framework/pyproject.toml') }}
      - name: Validate cached venv
        if: steps.venv-cache.outputs.cache-hit == 'true'
        run: |
          if ! .venv/bin/python --version > /dev/null 2>&1; then
            echo "Cached venv is invalid (Python version mismatch), recreating..."
            rm -rf .venv
            echo "venv-invalid=true" >> "$GITHUB_ENV"
          fi
      - name: Install dependencies
        if: steps.venv-cache.outputs.cache-hit != 'true' || env.venv-invalid == 'true'
        run: |
          python -m venv .venv
          .venv/bin/pip install -e ../../packages/judgemind-config
          .venv/bin/pip install -e ".[dev]"
      - name: Lint
        if: matrix.shard == 1
        run: .venv/bin/ruff check src/ tests/
      - name: Format check
        if: matrix.shard == 1
        run: .venv/bin/ruff format --check src/ tests/
      - name: Test
        run: >-
          .venv/bin/pytest ${{ matrix.test-paths }}
          -n auto -v --tb=short --durations=30
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-scraper-courts-${{ matrix.shard }}
          path: packages/scraper-framework/coverage.xml
      - name: Upload to Codecov
        if: always() && hashFiles('packages/scraper-framework/coverage.xml') != ''
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: packages/scraper-framework/coverage.xml
          flags: scraper-courts-${{ matrix.shard }}
          fail_ci_if_error: false

  ingestion-tests:
    needs: detect-changes
    if: needs.detect-changes.outputs.scraper == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/scraper-framework
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        id: setup-python
        with:
          python-version: '3.12'
      - uses: actions/cache@v5
        id: venv-cache
        with:
          path: packages/scraper-framework/.venv
          key: venv-scraper-${{ runner.os }}-py${{ steps.setup-python.outputs.python-version }}-${{ hashFiles('packages/scraper-framework/pyproject.toml') }}
      - name: Validate cached venv
        if: steps.venv-cache.outputs.cache-hit == 'true'
        run: |
          if ! .venv/bin/python --version > /dev/null 2>&1; then
            echo "Cached venv is invalid (Python version mismatch), recreating..."
            rm -rf .venv
            echo "venv-invalid=true" >> "$GITHUB_ENV"
          fi
      - name: Install dependencies
        if: steps.venv-cache.outputs.cache-hit != 'true' || env.venv-invalid == 'true'
        run: |
          python -m venv .venv
          .venv/bin/pip install -e ../../packages/judgemind-config
          .venv/bin/pip install -e ".[dev]"
      - name: Test
        run: >-
          .venv/bin/pytest
          tests/test_reingest_from_s3.py
          tests/test_reingest_registry.py
          tests/test_ingestion.py
          tests/test_extract.py
          -n auto -v --tb=short --durations=30
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-scraper-ingestion
          path: packages/scraper-framework/coverage.xml
      - name: Upload to Codecov
        if: always() && hashFiles('packages/scraper-framework/coverage.xml') != ''
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: packages/scraper-framework/coverage.xml
          flags: scraper-ingestion
          fail_ci_if_error: false

  nlp-tests:
    needs: detect-changes
    if: needs.detect-changes.outputs.nlp == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/nlp-pipeline
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        id: setup-python
        with:
          python-version: '3.12'
      - uses: actions/cache@v5
        id: venv-cache
        with:
          path: packages/nlp-pipeline/.venv
          key: venv-nlp-${{ runner.os }}-py${{ steps.setup-python.outputs.python-version }}-${{ hashFiles('packages/nlp-pipeline/pyproject.toml') }}
      - name: Validate cached venv
        if: steps.venv-cache.outputs.cache-hit == 'true'
        run: |
          if ! .venv/bin/python --version > /dev/null 2>&1; then
            echo "Cached venv is invalid (Python version mismatch), recreating..."
            rm -rf .venv
            echo "venv-invalid=true" >> "$GITHUB_ENV"
          fi
      - name: Install dependencies
        if: steps.venv-cache.outputs.cache-hit != 'true' || env.venv-invalid == 'true'
        run: |
          python -m venv .venv
          .venv/bin/pip install -e ../../packages/judgemind-config
          .venv/bin/pip install -e ".[dev]"
      - name: Lint
        run: .venv/bin/ruff check src/ tests/
      - name: Format check
        run: .venv/bin/ruff format --check src/ tests/
      - name: Test
        run: .venv/bin/pytest tests/ -v --tb=short
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-nlp
          path: packages/nlp-pipeline/coverage.xml
      - name: Upload to Codecov
        if: always() && hashFiles('packages/nlp-pipeline/coverage.xml') != ''
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: packages/nlp-pipeline/coverage.xml
          flags: nlp
          fail_ci_if_error: false

  api-tests:
    needs: detect-changes
    if: needs.detect-changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/api
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: judgemind
          POSTGRES_PASSWORD: localdev
          POSTGRES_DB: judgemind
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      opensearch:
        image: opensearchproject/opensearch:2.12.0
        env:
          discovery.type: single-node
          DISABLE_SECURITY_PLUGIN: "true"
          OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
        ports:
          - 9200:9200
        options: >-
          --health-cmd "curl -sf http://localhost:9200/_cluster/health || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      # TEST_DATABASE_URL (not DATABASE_URL) — integration tests read the
      # test-only var so `npm test` run in any operational env (e.g. a ralph
      # subagent inside the dispatcher container) cannot accidentally migrate
      # the operational dev RDS database. See #3006.
      TEST_DATABASE_URL: postgresql://judgemind:localdev@localhost:5432/judgemind
      TEST_OPENSEARCH_URL: http://localhost:9200
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm ci
      - name: Run database migrations
        # Run migrations directly against TEST_DATABASE_URL. We do NOT reuse
        # `npm run db:migrate` (which wraps seed-and-migrate.mjs) because that
        # script reads `DATABASE_URL` and is the deploy migration path (#3006
        # scope boundary — do not touch the deploy path). node-pg-migrate is
        # configured via .node-pg-migraterc to read DATABASE_URL, so we pass
        # TEST_DATABASE_URL through it for this step only.
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
        run: npx node-pg-migrate up --no-timestamp
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Test
        run: npx vitest run --coverage --passWithNoTests
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-api
          path: packages/api/coverage/lcov.info
      - name: Upload to Codecov
        if: always() && hashFiles('packages/api/coverage/lcov.info') != ''
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: packages/api/coverage/lcov.info
          flags: api
          fail_ci_if_error: false

  web-tests:
    needs: detect-changes
    if: needs.detect-changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/web
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Test
        run: npx vitest run --coverage --passWithNoTests
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-web
          path: packages/web/coverage/lcov.info
      - name: Upload to Codecov
        if: always() && hashFiles('packages/web/coverage/lcov.info') != ''
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: packages/web/coverage/lcov.info
          flags: web
          fail_ci_if_error: false
      - name: Build
        run: npm run build

  infra-validate:
    needs: detect-changes
    if: needs.detect-changes.outputs.infra == 'true'
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: us-west-2
      TF_IN_AUTOMATION: true
    steps:
      - uses: actions/checkout@v6
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: '1.7'
      - name: Terraform fmt check
        run: terraform fmt -check -recursive infra/terraform/

      # Validate each environment (no credentials needed)
      - name: Validate dev
        run: |
          terraform -chdir=infra/terraform/environments/dev init -backend=false
          terraform -chdir=infra/terraform/environments/dev validate
      - name: Validate production
        run: |
          terraform -chdir=infra/terraform/environments/production init -backend=false
          terraform -chdir=infra/terraform/environments/production validate

      # Plan with real backend to catch provider-specific attribute errors
      # (e.g. wrong resource attribute names that `validate` misses).
      # Skipped if AWS credentials are not configured.
      - name: Terraform Init (dev)
        if: env.AWS_ACCESS_KEY_ID != ''
        run: terraform -chdir=infra/terraform/environments/dev init
      - name: Terraform Plan (dev)
        if: env.AWS_ACCESS_KEY_ID != ''
        run: terraform -chdir=infra/terraform/environments/dev plan -no-color -input=false -lock=false

  scripts-tests:
    needs: detect-changes
    if: needs.detect-changes.outputs.scripts == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Shard python: both pytest suites + all 11 inline shell guards.
          # pytest-xdist (-n auto) parallelises the 73-file dispatcher suite
          # (~292s sequential → ~150-200s). Estimated wall-clock ~200s.
          - shard: python
          # Shard shell: scripts/run-scripts-tests.sh only.
          # Dominated by test_agent_runner_entrypoint.sh (~275s) and
          # test_check_dispatcher_image_versions.sh (~58s).
          # Estimated wall-clock ~395s. See issue #3307.
          - shard: shell
    env:
      PYTHONPATH: scripts
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Install test dependencies
        run: pip install pytest pytest-xdist boto3 -e packages/judgemind-config
      - name: Install Node.js test dependencies
        run: npm install --no-save graphql@^16.8
      - name: Test
        if: matrix.shard == 'python'
        run: pytest scripts/tests/ -v --tb=short
      # Dispatcher v2 daemon skeleton tests (scripts/dispatcher/tests/).
      # Separate invocation because these live in their own package dir
      # (scripts/dispatcher/tests/) rather than under scripts/tests/.
      # Mocks psycopg — no DB required in CI. See issue #2729.
      # -n auto: mocks + tmp_path/monkeypatch make the suite xdist-safe
      # (no os.chdir, only mocked sleeps). See issue #3307.
      - name: Test dispatcher daemon skeleton
        if: matrix.shard == 'python'
        run: pytest scripts/dispatcher/tests/ -v --tb=short -n auto -m "not integration"
      - name: Check AWS CLI boolean flag usage
        if: matrix.shard == 'python'
        run: scripts/check-aws-bool-flags.sh
      - name: Check AWS CLI flag portability
        if: matrix.shard == 'python'
        run: scripts/check-aws-flag-portability.sh
      - name: Check for forbidden ECS services-stable waiter usage
        if: matrix.shard == 'python'
        run: scripts/check-no-ecs-wait-services-stable.sh
      - name: Check workflows use the extracted ECS post-deploy healthcheck
        if: matrix.shard == 'python'
        run: scripts/check-no-inline-ecs-healthcheck.sh
      - name: Check docs describe the actual rebuild_db.py CLI
        if: matrix.shard == 'python'
        run: scripts/check-no-rebuild-db-skip-reset.sh
      - name: Check tests use POSIX sed instead of GNU head negative count
        if: matrix.shard == 'python'
        run: scripts/check-no-gnu-head.sh
      - name: Check test files do not redefine the same stub binary
        if: matrix.shard == 'python'
        run: scripts/check-no-duplicate-stubs.sh
      # Issue #3670: detect markers in appended-list files (e.g.
      # test_agent_runner_entrypoint.sh) that would be silently dropped
      # by git merge-tree when rebasing onto origin/main — i.e. a merge
      # that produces no conflict markers but loses a test block.
      # fetch-depth: 0 (set on this job's checkout) ensures origin/main
      # is reachable. The check exits 0 gracefully on shallow clones.
      - name: Check rebase does not silently drop appended-list markers
        if: matrix.shard == 'python'
        run: scripts/check-rebase-no-silent-drop.sh
      # Cross-checks every non-stdlib import under scripts/dispatcher/ against
      # the pip install step in Dockerfile.dispatcher. Motivated by the #2773
      # boto3 scope miss (#2776): PR #2771 added `import boto3` but did not
      # add boto3 to Dockerfile.dispatcher, and no test caught it because the
      # daemon tests mock the client by method assignment.
      - name: Verify dispatcher image installs every Python import used by the daemon
        if: matrix.shard == 'python'
        run: scripts/check-dispatcher-image-deps.sh
      # Issues #3062 (audit) + #3072 (this check): every
      # ``self._mark_agent_terminal`` call site in
      # ``scripts/dispatcher/daemon.py`` must carry a nearby
      # ``ROUTING (#N)`` comment documenting whether the site routes
      # through ``_handle_agent_failure`` or is intentionally unrouted.
      # This would have caught the #3054 ralph_not_ship bug at author
      # time.
      - name: Verify every daemon terminal site has a ROUTING comment
        if: matrix.shard == 'python'
        run: scripts/check-terminal-routing-comments.sh
      # Issue #3089: every ``subprocess.run([... "git" | "gh" ...])``
      # call site in ``scripts/dispatcher/daemon.py`` must either route
      # through the shared ``_subprocess_with_retry`` helper or carry a
      # nearby ``# cold-path (#3089)`` annotation. Prevents the
      # #3053/#3085 class of single-transient-failure bug from creeping
      # back in.
      - name: Verify every daemon git/gh subprocess site has retry or cold-path annotation
        if: matrix.shard == 'python'
        run: scripts/check-git-gh-retries.sh
      # Issue #3776: every *_TIMEOUT_SECONDS constant referenced inside a
      # phase-loop function (one that dispatches on a ``phase`` argument)
      # must use a per-phase access form (BY_PHASE table, token embedding
      # the phase name, or *_for_phase() helper), or carry a
      # ``# global-by-design (#NNNN)`` annotation on its declaration.
      # Prevents accidental uniform-across-all-phases caps when per-phase
      # tuning is the intent.
      - name: Verify phase-loop functions use per-phase timeout lookups
        if: matrix.shard == 'python'
        run: scripts/check-per-phase-timeouts.sh
      # Issue #3213: every ``subprocess.run(...)`` call site in
      # ``scripts/**/*.py`` (excluding ``scripts/**/tests/**``) must have
      # a ``timeout=`` kwarg or a ``**kwargs`` splat. An unbounded blocking
      # subprocess.run was the prime hypothesis for the #3205 silent-daemon
      # wedge class. This check prevents regression.
      - name: Verify every subprocess.run call in scripts has timeout= or **kwargs
        if: matrix.shard == 'python'
        run: scripts/check-subprocess-timeouts.sh
      # Issue #3356: every IO call site under scripts/dispatcher/
      # (boto3.client, psycopg.connect, subprocess.run/Popen/check_*,
      # requests.*, urllib.request.urlopen, socket.create_connection,
      # http.client.HTTP{S,}Connection) must carry a bounded timeout.
      # The 2026-04-25 cascade was caused by a single unbounded
      # boto3.client("ecs", ...); PR #3353 fixed that one site. This
      # AST-based check enforces the structural invariant going forward.
      - name: Check no unbounded timeouts in dispatcher
        if: matrix.shard == 'python'
        run: scripts/check-no-unbounded-timeouts.py
      # Issue #3158: every ``UPDATE dispatcher.agents`` /
      # ``SELECT ... FROM dispatcher.agents`` line in
      # ``scripts/dispatcher/daemon.py`` must either mention
      # ``execution_mode`` / ``agent_task_arn`` within +/- 60 lines,
      # OR carry an ``exec-mode-agnostic (#N): <reason>`` annotation
      # nearby. Prevents the #3091-draft / #3128-era / #3152 class of
      # silent-ECS-agent-loss bug from creeping back in.
      - name: Verify every dispatcher.agents SQL site is execution_mode-aware
        if: matrix.shard == 'python'
        run: scripts/check-dispatcher-execution-mode-aware.sh
      # Issue #2829: every ``subprocess.run([... "git" ...])`` call site in
      # ``scripts/dispatcher/daemon.py`` whose first positional arg resolves
      # to a list literal beginning with ``"git"`` AND containing
      # ``self._repo_root()`` is a bug — in Fargate mode, ``_repo_root()``
      # returns ``/app`` (no ``.git`` directory). The correct anchor is
      # ``_git_parent_root()``.
      - name: Verify no git subprocess in daemon.py anchors at self._repo_root()
        if: matrix.shard == 'python'
        run: bash scripts/check-no-git-repo-root-anchor.sh
      # Issue #3082: operator laptops run macOS's stock bash 3.2.
      # Shell scripts under scripts/**/*.sh must stick to the bash 3.2
      # subset — no mapfile, readarray, associative arrays, nameref,
      # case-conversion parameter expansions, ;;& case fall-through,
      # or |& pipe shorthand. Retro of #3081's near-miss: the first
      # draft of check-terminal-routing-comments.sh used mapfile and
      # silently exited 127 on the operator's laptop. See
      # docs/agent/code-standards.md §macOS bash 3.2 compatibility.
      - name: Verify scripts stay within the bash 3.2 feature subset
        if: matrix.shard == 'python'
        run: scripts/check-bash-compat.sh
      # Auto-discover and run every executable shell test under
      # scripts/tests/*.sh. Replaces the old per-script listing (#2505) so
      # that adding a new shell test is just `touch + chmod +x` — no
      # matching ci.yml edit required. Previously, three tests
      # (test_check_oneshot_imports.sh, test_ecs_logs.sh, test_preflight.sh)
      # were silently never running in CI because they'd never been added
      # to the list.
      #
      # Runner logic lives in scripts/run-scripts-tests.sh so it is
      # unit-testable (see scripts/tests/test_scripts_tests_runner.sh,
      # #2559). Files whose basename starts with '_' are treated as
      # shared helpers and are never executed as tests — see the runner
      # for the full filter rules.
      #
      # SKIP_TESTS: tests that are expensive AND already covered by a
      # dedicated CI job with its own narrow path filter. Keeping them
      # here would mean running them twice whenever scripts/** changes.
      #
      #   test_pre_push.sh (~32s)  — dedicated job: githooks-pre-push-test
      #                              triggered by the `githooks` path
      #                              filter (.githooks/**, the test file
      #                              itself, and ci.yml). See #2536 for
      #                              the duration regression this skip
      #                              addresses (+34s, +112%).
      - name: Run all scripts/tests shell tests
        if: matrix.shard == 'shell'
        shell: bash
        env:
          # Whitespace-separated list of test paths to defer to their own
          # dedicated CI jobs. See the comment above this step for why.
          SKIP_TESTS: "scripts/tests/test_pre_push.sh"
        run: scripts/run-scripts-tests.sh
      - name: Run all scripts/dispatcher/tests shell tests
        if: matrix.shard == 'shell'
        shell: bash
        # TESTS_DIR is already plumbed by scripts/run-scripts-tests.sh and
        # unit-tested by scripts/tests/test_scripts_tests_runner.sh.
        # This step auto-picks up test_agent_runner_run_claude_phase.sh (#3775),
        # test_agent_runner_hook_swap.sh (#3757), and
        # test_ralph_output_synthesis.sh (#3782).
        run: TESTS_DIR=scripts/dispatcher/tests scripts/run-scripts-tests.sh

  # ---------------------------------------------------------------
  # Dispatcher integration tests — real git/subprocess, no mocks.
  # Runs on the same path filter as scripts-tests (scripts/**) but in
  # a separate job so the unit job stays network-free and fast.
  # See scripts/dispatcher/tests/test_daemon_integration.py for the
  # marker convention.  Issue #2810.
  # ---------------------------------------------------------------
  dispatcher-integration-tests:
    needs: detect-changes
    if: needs.detect-changes.outputs.scripts == 'true'
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: scripts
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: pip install pytest -e packages/judgemind-config
      - name: Run dispatcher integration tests
        run: pytest scripts/dispatcher/tests/test_daemon_integration.py -v --tb=short -m integration

  # ---------------------------------------------------------------
  # Coverage gates: diff coverage (new lines) + overall floor ratchet
  # ---------------------------------------------------------------
  coverage-check:
    needs: [detect-changes, scraper-framework-tests, scraper-court-tests, ingestion-tests, nlp-tests, api-tests, web-tests]
    if: always() && github.event_name == 'pull_request' && needs.detect-changes.outputs.any-testable == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install diff-cover
        run: pip install diff-cover

      # Download all coverage artifacts (each upload is optional — packages
      # that were skipped or had no tests will simply be missing).
      - uses: actions/download-artifact@v8
        with:
          pattern: coverage-*
          path: coverage-artifacts/
          merge-multiple: false

      - name: List downloaded artifacts
        run: find coverage-artifacts/ -type f 2>/dev/null || echo "No artifacts"

      # --- Diff coverage checks (new/changed lines must be >= 90% covered) ---

      - name: Diff coverage — scraper-framework
        if: needs.detect-changes.outputs.scraper == 'true'
        run: |
          COV_FRAMEWORK="coverage-artifacts/coverage-scraper-framework/coverage.xml"
          COV_COURTS_1="coverage-artifacts/coverage-scraper-courts-1/coverage.xml"
          COV_COURTS_2="coverage-artifacts/coverage-scraper-courts-2/coverage.xml"
          COV_INGEST="coverage-artifacts/coverage-scraper-ingestion/coverage.xml"
          COV_FILES=""
          for f in "$COV_FRAMEWORK" "$COV_COURTS_1" "$COV_COURTS_2" "$COV_INGEST"; do
            if [ -f "$f" ]; then COV_FILES="$COV_FILES $f"; fi
          done
          if [ -n "$COV_FILES" ]; then
            diff-cover $COV_FILES --compare-branch=origin/main --fail-under=90 --diff-range-notation='..'
          else
            echo "No coverage artifact for scraper-framework — skipping diff-cover"
          fi

      - name: Diff coverage — nlp-pipeline
        if: needs.detect-changes.outputs.nlp == 'true'
        run: |
          COV_FILE="coverage-artifacts/coverage-nlp/coverage.xml"
          if [ -f "$COV_FILE" ]; then
            diff-cover "$COV_FILE" --compare-branch=origin/main --fail-under=90 --diff-range-notation='..'
          else
            echo "No coverage artifact for nlp-pipeline — skipping diff-cover"
          fi

      - name: Diff coverage — api
        if: needs.detect-changes.outputs.api == 'true'
        run: |
          COV_FILE="coverage-artifacts/coverage-api/lcov.info"
          if [ -f "$COV_FILE" ]; then
            diff-cover "$COV_FILE" --compare-branch=origin/main --fail-under=90 --diff-range-notation='..'
          else
            echo "No coverage artifact for api — skipping diff-cover"
          fi

      - name: Diff coverage — web
        if: needs.detect-changes.outputs.web == 'true'
        run: |
          COV_FILE="coverage-artifacts/coverage-web/lcov.info"
          if [ -f "$COV_FILE" ]; then
            diff-cover "$COV_FILE" --compare-branch=origin/main --fail-under=90 --diff-range-notation='..'
          else
            echo "No coverage artifact for web — skipping diff-cover"
          fi

      # --- Overall coverage floor ratchet ---
      # Fails if any package's coverage dropped below its baseline.

      - name: Coverage floor ratchet — scraper-framework
        if: needs.detect-changes.outputs.scraper == 'true'
        run: |
          # Merge coverage from all split scraper test jobs (framework,
          # court shard 1, court shard 2, ingestion).
          # Uses separate baselines for partial vs full runs:
          #   - "packages/scraper-framework" (combined) when ALL three test
          #     jobs (framework, courts, ingestion) produced coverage
          #   - "packages/scraper-framework:framework-only" (partial) when
          #     any test job was skipped (e.g. courts-only or
          #     framework-only changes)
          COV_ARGS=""
          COV_FRAMEWORK="coverage-artifacts/coverage-scraper-framework/coverage.xml"
          COV_COURTS_1="coverage-artifacts/coverage-scraper-courts-1/coverage.xml"
          COV_COURTS_2="coverage-artifacts/coverage-scraper-courts-2/coverage.xml"
          COV_INGEST="coverage-artifacts/coverage-scraper-ingestion/coverage.xml"
          HAS_ANY=false
          HAS_COURTS=false
          for f in "$COV_FRAMEWORK" "$COV_COURTS_1" "$COV_COURTS_2" "$COV_INGEST"; do
            if [ -f "$f" ]; then
              COV_ARGS="$COV_ARGS --coverage-file $f"
              HAS_ANY=true
            fi
          done
          # Check if either court shard produced coverage
          if [ -f "$COV_COURTS_1" ] || [ -f "$COV_COURTS_2" ]; then
            HAS_COURTS=true
          fi
          if [ "$HAS_ANY" = "false" ]; then
            echo "No coverage artifacts found — skipping floor ratchet"
            exit 0
          fi
          if [ "$HAS_COURTS" = "false" ] && [ ! -f "$COV_FRAMEWORK" ]; then
            echo "Neither framework nor court coverage available — skipping"
            exit 0
          fi
          # Choose baseline key based on which test jobs ran.
          # Use the combined (strict) baseline only when ALL three test
          # jobs produced coverage artifacts.  If any job was skipped
          # (e.g. courts-only or framework-only changes), use the
          # partial baseline to avoid false failures.
          BASELINE_KEY="packages/scraper-framework"
          if [ -f "$COV_FRAMEWORK" ] && [ "$HAS_COURTS" = "true" ] && [ -f "$COV_INGEST" ]; then
            echo "All test jobs ran — enforcing combined baseline"
          else
            BASELINE_KEY="packages/scraper-framework:framework-only"
            echo "Partial test run (not all jobs produced coverage) — enforcing partial baseline"
          fi
          python scripts/update-coverage-baselines.py \
            --package packages/scraper-framework \
            --baseline-key "$BASELINE_KEY" \
            $COV_ARGS \
            --dry-run

      - name: Coverage floor ratchet — nlp-pipeline
        if: needs.detect-changes.outputs.nlp == 'true'
        run: |
          COV_FILE="coverage-artifacts/coverage-nlp/coverage.xml"
          if [ -f "$COV_FILE" ]; then
            python scripts/update-coverage-baselines.py \
              --package packages/nlp-pipeline \
              --coverage-file "$COV_FILE" \
              --dry-run
          fi

      - name: Coverage floor ratchet — api
        if: needs.detect-changes.outputs.api == 'true'
        run: |
          COV_FILE="coverage-artifacts/coverage-api/lcov.info"
          if [ -f "$COV_FILE" ]; then
            python scripts/update-coverage-baselines.py \
              --package packages/api \
              --coverage-file "$COV_FILE" \
              --dry-run
          fi

      - name: Coverage floor ratchet — web
        if: needs.detect-changes.outputs.web == 'true'
        run: |
          COV_FILE="coverage-artifacts/coverage-web/lcov.info"
          if [ -f "$COV_FILE" ]; then
            python scripts/update-coverage-baselines.py \
              --package packages/web \
              --coverage-file "$COV_FILE" \
              --dry-run
          fi

  # ---------------------------------------------------------------
  # Data quality baselines structural validation
  # ---------------------------------------------------------------
  dq-baselines-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Validate data-quality-baselines.json
        run: python scripts/validate-dq-baselines.py

  # ---------------------------------------------------------------
  # Deprecated model guard: prevent use of deprecated Anthropic models
  # ---------------------------------------------------------------
  deprecated-models-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check for deprecated Anthropic model identifiers
        run: scripts/check-deprecated-models.sh

  # ---------------------------------------------------------------
  # Hardcoded model guard: enforce model ID centralization
  # ---------------------------------------------------------------
  hardcoded-models-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check for hardcoded Claude model identifiers
        run: scripts/check-hardcoded-models.sh

  # ---------------------------------------------------------------
  # Terraform empty-resource risk guard: detect IAM resources with
  # compact([var.*]) Resource lists that lack a count/for_each guard
  # ---------------------------------------------------------------
  terraform-empty-resource-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Validate IAM Resource compaction has count guard
        run: scripts/check-terraform-empty-resource-risk.sh

  # ---------------------------------------------------------------
  # Placeholder gates guard: prevent stub security gates
  # ---------------------------------------------------------------
  placeholder-gates-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Run placeholder gates check
        run: scripts/check-placeholder-gates.sh

  # ---------------------------------------------------------------
  # Hardcoded color guard: enforce semantic design tokens in TSX
  # ---------------------------------------------------------------
  hardcoded-colors-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check for hardcoded Tailwind color classes in TSX
        run: scripts/check-hardcoded-colors.sh

  # ---------------------------------------------------------------
  # Admin dispatcher brand-accent guard: block bare shadcn accent
  # tokens on `/admin/dispatcher` so readability regressions like
  # #2816 (invisible gray issue/PR links) don't recur.
  # ---------------------------------------------------------------
  admin-dispatcher-brand-accent-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Enforce brand-accent on /admin/dispatcher link chrome
        run: scripts/check-admin-dispatcher-brand-accent.sh

  # ---------------------------------------------------------------
  # BRAND.md ↔ tailwind.config.ts drift check: ensure the Accent
  # table and Tailwind Token Mapping block in docs/BRAND.md stay in
  # sync with packages/web/tailwind.config.ts (#2831).
  # ---------------------------------------------------------------
  docs-tailwind-drift-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Verify BRAND.md Tailwind tokens match web config
        run: scripts/check-brand-md-tokens.sh

  # ---------------------------------------------------------------
  # LLM JSON loads guard: flag raw json.loads on LLM response text
  # — should use parse_llm_json (or strict=False) instead (#2550).
  # ---------------------------------------------------------------
  llm-json-loads-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check for raw json.loads on LLM response text
        run: scripts/check-llm-json-loads.sh

  # ---------------------------------------------------------------
  # Test DATABASE_URL fallback guard: api tests must read
  # TEST_DATABASE_URL, not the operational DATABASE_URL (#3006)
  # ---------------------------------------------------------------
  test-database-url-fallback-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check api tests consult TEST_DATABASE_URL, not the operational env var
        run: scripts/check-no-test-database-url-fallback.sh

  # ---------------------------------------------------------------
  # OpenSearch URL fallback guard: api tests must read
  # TEST_OPENSEARCH_URL, not the operational OPENSEARCH_URL
  # ---------------------------------------------------------------
  opensearch-url-fallback-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check api tests consult TEST_OPENSEARCH_URL, not the operational env var
        run: scripts/check-no-opensearch-url-fallback.sh

  # ---------------------------------------------------------------
  # GitHub API call guard: api container src must not call GitHub (#2839)
  # ---------------------------------------------------------------
  no-api-github-fetch-check:
    needs: detect-changes
    if: needs.detect-changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Enforce API container has no GitHub API calls
        run: scripts/check-no-api-github-fetch.sh

  # ---------------------------------------------------------------
  # Dispatcher terminal-status sync guard (#2863)
  # ---------------------------------------------------------------
  dispatcher-terminal-statuses-check:
    needs: detect-changes
    if: needs.detect-changes.outputs.scripts == 'true' || needs.detect-changes.outputs.api == 'true' || needs.detect-changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Assert Python and TypeScript terminal-status lists match
        run: scripts/check-dispatcher-terminal-statuses.sh

  # ---------------------------------------------------------------
  # Dispatcher transition-action vocabulary guard (#3581)
  # Asserts every TransitionAction enum value AND every FAILURE_HINT_*
  # constant in scripts/dispatcher/phase_transitions.py is handled by
  # the centralized dispatch_transition_action helper in
  # scripts/dispatcher/agent-runner-entrypoint.sh. Without this guard,
  # adding a new action / hint without updating the helper produces the
  # cluster-bug pattern from #3543/#3558/#3573/#3580.
  # ---------------------------------------------------------------
  dispatcher-dispatch-vocabulary-check:
    needs: detect-changes
    if: needs.detect-changes.outputs.scripts == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Assert TransitionAction + FAILURE_HINT vocabularies match dispatch helper
        run: scripts/check-transition-dispatch-vocabulary.sh

  # ---------------------------------------------------------------
  # Schema drift guard: schema.sql must match applied migrations
  # ---------------------------------------------------------------
  schema-drift-check:
    needs: detect-changes
    if: needs.detect-changes.outputs.schema == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check schema.sql matches migrations
        run: scripts/check_schema_drift.sh --ci

  # ---------------------------------------------------------------
  # Migration file guard: validate naming and sequencing
  # ---------------------------------------------------------------
  migration-files-check:
    needs: detect-changes
    if: needs.detect-changes.outputs.migrations == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Validate migration file naming and sequencing
        run: scripts/check-migration-files.sh

  # ---------------------------------------------------------------
  # Cross-PR migration number guard: detect when two open PRs both
  # claim the same migration number (see #2916). `migration-files-check`
  # only sees the current PR's diff; this job compares against every
  # other open PR via `gh pr list --json number,title,files`.
  # ---------------------------------------------------------------
  migration-collision-check:
    needs: detect-changes
    if: needs.detect-changes.outputs.migrations == 'true'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          # Need history for `git merge-base HEAD origin/main` to find the
          # diff base; fetch-depth: 0 pulls full history.
          fetch-depth: 0
      - name: Fetch origin/main for diff base
        run: git fetch origin main --depth=50
      - name: Check cross-PR migration number claims
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REF: ${{ github.ref }}
        run: scripts/check-migration-number-collision.sh --base origin/main

  # ---------------------------------------------------------------
  # Nullable column read guard: detect unguarded reads of columns
  # that had NOT NULL dropped in this diff (see #3394, #3396).
  # ---------------------------------------------------------------
  nullable-column-reads-check:
    needs: detect-changes
    if: needs.detect-changes.outputs.migrations == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Check for unguarded reads of columns with dropped NOT NULL constraint
        run: scripts/check-nullable-column-reads.sh --base origin/main

  # ---------------------------------------------------------------
  # GraphQL nullability drift: detect GraphQL fields still declared
  # non-null after the backing DB column had NOT NULL dropped (#3441).
  # ---------------------------------------------------------------
  graphql-nullability-drift-check:
    needs: detect-changes
    if: needs.detect-changes.outputs.migrations == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Fetch origin/main for diff base
        run: git fetch origin main --depth=50
      - name: Check for GraphQL fields still non-null after backing column dropped NOT NULL
        run: scripts/check-graphql-nullability-drift.sh --base origin/main

  # ---------------------------------------------------------------
  # ECS oneshot import guard: prevent scripts/ from importing siblings
  # ---------------------------------------------------------------
  oneshot-imports-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check for sibling imports in oneshot scripts
        run: scripts/check-oneshot-imports.sh

  # ---------------------------------------------------------------
  # ECS oneshot repo-path guard: flag scripts that use REPO_ROOT
  # without a validated fallback for when the repo is unavailable (#1277)
  # ---------------------------------------------------------------
  oneshot-repo-paths-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check for unvalidated REPO_ROOT references in oneshot scripts
        run: scripts/check-oneshot-repo-paths.sh

  # ---------------------------------------------------------------
  # Duplicate function guard: detect shadowed function definitions
  # ---------------------------------------------------------------
  duplicate-functions-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check for duplicate function definitions in Python
        run: scripts/check-duplicate-functions.sh

  # ---------------------------------------------------------------
  # Test swallow guard: forbid `try/except Exception: pass` in test
  # files — prevents a class of silent test regression where the
  # call under test is wrapped in a blind swallow (#2443, #2459).
  # ---------------------------------------------------------------
  test-except-pass-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: "Forbid `try/except Exception: pass` in test files"
        run: scripts/check-test-except-pass.sh

  # ---------------------------------------------------------------
  # Script header guard: top-level scripts/*.py whose name matches a
  # one-off pattern (backfill, cleanup, fix, dedup, merge, migrate,
  # remediat) must carry `# one-off: true` OR `# permanent: true` in
  # the first 50 lines. Replaces the "first 10 lines" rule-of-thumb
  # with a machine-verifiable check (#2533).
  # ---------------------------------------------------------------
  script-headers-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check one-off/permanent markers on scripts/*.py
        run: scripts/check-script-headers.sh

  # ---------------------------------------------------------------
  # Filename separator hygiene: flag same-directory filename pairs that
  # differ only by `-` vs `_`. Prevents the #2751 / #2754 recurrence
  # where `scripts/check-schema-drift.sh` (hyphen, broken) coexisted
  # with `scripts/check_schema_drift.sh` (underscore, canonical) and
  # agents picked the alphabetically-first wrong one.
  # ---------------------------------------------------------------
  filename-separator-hygiene-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Filename separator hygiene
        run: scripts/check-hyphen-underscore-collision.sh

  # ---------------------------------------------------------------
  # Markdown link guard: internal .md pointers in CLAUDE.md, docs/,
  # .claude/skills/, packages/*/README.md, packages/*/docs/,
  # infra/, and .github/ must point to files that exist (#2425, #2428)
  # ---------------------------------------------------------------
  markdown-links-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check for broken markdown pointers
        run: scripts/check-markdown-links.sh

  # ---------------------------------------------------------------
  # SQL ON CONFLICT target validation: verify conflict targets match schema
  # ---------------------------------------------------------------
  sql-conflict-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Validate ON CONFLICT targets against schema constraints
        run: python3 scripts/check-sql-conflicts.py

  # ---------------------------------------------------------------
  # SQL column reference validation: verify column references match schema
  # ---------------------------------------------------------------
  sql-column-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Validate SQL column references against schema definitions
        run: python3 scripts/check-sql-columns.py

  # ---------------------------------------------------------------
  # Shard coverage guard: all court test files listed in shard config
  # ---------------------------------------------------------------
  shard-coverage-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check all court test files are in shard config
        run: scripts/check-shard-coverage.sh

  # ---------------------------------------------------------------
  # Apollo keyFields guard: types without `id` need cache config
  # ---------------------------------------------------------------
  apollo-keyfields-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check GraphQL types without id have Apollo keyFields
        run: scripts/check-apollo-keyfields.sh

  # ---------------------------------------------------------------
  # GraphQL query validation: frontend queries must match API schema
  # ---------------------------------------------------------------
  graphql-query-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Install graphql package
        run: npm install --no-save graphql@^16.8
      - name: Validate frontend GraphQL queries against API schema
        run: scripts/check-graphql-queries.sh

  # ---------------------------------------------------------------
  # Scraper registry guard: all scraper modules must be registered in runner.py (#2132)
  # ---------------------------------------------------------------
  scraper-registry-check:
    needs: detect-changes
    if: needs.detect-changes.outputs.scraper == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check all scraper modules are registered in runner.py
        run: scripts/check-scraper-registry.sh

  # ---------------------------------------------------------------
  # Removed exports guard: detect broken imports from removed/renamed exports (#2001)
  # ---------------------------------------------------------------
  removed-exports-check:
    needs: detect-changes
    if: needs.detect-changes.outputs.scraper == 'true' || needs.detect-changes.outputs.nlp == 'true' || needs.detect-changes.outputs.api == 'true' || needs.detect-changes.outputs.scripts == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Check for broken imports from removed exports
        run: scripts/check-removed-exports.sh

  # ---------------------------------------------------------------
  # CI job-skipped guard: detect jobs whose body is modified on a PR
  # but would be SKIPPED on that PR's CI run because their paths-filter
  # if-gate doesn't match anything in the diff (#2410, #2505, #2527).
  # ---------------------------------------------------------------
  ci-job-skipped-check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Detect modified CI jobs that would be skipped on their own PR
        run: python3 scripts/check-ci-job-skipped.py --base "origin/${{ github.event.pull_request.base.ref }}"

  # ---------------------------------------------------------------
  # Preflight hook test suite: runs when .claude/hooks/ changes (#2408)
  # ---------------------------------------------------------------
  preflight-hook-test:
    needs: detect-changes
    if: needs.detect-changes.outputs.hooks == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Run hook test suites
        run: |
          set -euo pipefail
          shopt -s nullglob
          tests=(.claude/hooks/test_*.py)
          if [ ${#tests[@]} -eq 0 ]; then
            echo "No hook test files found under .claude/hooks/ — nothing to run."
            exit 0
          fi
          failed=0
          for t in "${tests[@]}"; do
            echo "::group::$t"
            if ! python3 "$t"; then
              failed=$((failed + 1))
            fi
            echo "::endgroup::"
          done
          if [ "$failed" -gt 0 ]; then
            echo "::error::$failed hook test suite(s) failed."
            exit 1
          fi
          echo "All ${#tests[@]} hook test suite(s) passed."

  # ---------------------------------------------------------------
  # Git pre-push hook integration tests (#2488).
  # Originally a regression guard for the #2487 stdin field-order bug;
  # #2488 expanded it into a full scenario suite (clean push, new/existing
  # branch detection, delete push, markdown-link rejection, WARNING paths
  # for missing ruff/actionlint/terraform).
  # ---------------------------------------------------------------
  githooks-pre-push-test:
    needs: detect-changes
    if: needs.detect-changes.outputs.githooks == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Run pre-push hook integration tests
        run: scripts/tests/test_pre_push.sh

  # ---------------------------------------------------------------
  # Dispatcher terminal-status consistency guard: verifies the five
  # terminal-status literals (issue #2870) match across daemon.py,
  # schema.ts, resolvers.ts, ui-primitives.tsx, and
  # RecentCompletionsPanel.tsx. Runs when any of the three source
  # areas changes (daemon, API GraphQL layer, web admin dispatcher).
  # ---------------------------------------------------------------
  dispatcher-terminal-consistency-check:
    needs: detect-changes
    if: needs.detect-changes.outputs.dispatcher-terminals == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Verify dispatcher terminal-status set is aligned across daemon API and web
        run: scripts/check-dispatcher-terminals-consistent.sh

  # ---------------------------------------------------------------
  # ECS oneshot Docker integration test: run scripts in a container
  # ---------------------------------------------------------------
  ecs-oneshot-test:
    needs: detect-changes
    if: needs.detect-changes.outputs.ecs-oneshot == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Run ECS oneshot integration tests
        run: .github/ecs-oneshot-test/run-tests.sh

  # ---------------------------------------------------------------
  # Playwright browser binary accessibility check (#1637)
  # Builds the scraper-framework Docker image and verifies the
  # non-root scraper user can resolve the Chromium binary path.
  # Catches regressions like #1625 before they reach production.
  # ---------------------------------------------------------------
  playwright-browser-check:
    needs: detect-changes
    if: needs.detect-changes.outputs.dockerfile == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - name: Build scraper-framework Docker image
        run: |
          docker build \
            -f packages/scraper-framework/Dockerfile \
            -t judgemind/scraper-framework:ci-test \
            .

      - name: Verify Playwright Chromium binary accessible as scraper user
        run: |
          docker run --rm \
            --entrypoint python3 \
            -v "$PWD/.github/playwright-browser-check/verify_browser.py:/tmp/verify_browser.py:ro" \
            judgemind/scraper-framework:ci-test \
            /tmp/verify_browser.py

  # ---------------------------------------------------------------
  # Migration notice: comment on PRs that include migration changes
  # ---------------------------------------------------------------
  migration-notice:
    needs: detect-changes
    if: github.event_name == 'pull_request' && needs.detect-changes.outputs.migrations == 'true'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Post migration notice
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          # Check if we already posted a migration notice on this PR
          EXISTING=$(curl -s \
            -H "Authorization: token $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/issues/${PR_NUMBER}/comments" \
            | jq '[.[] | select(.body | contains("database migration"))] | length')

          if [ "$EXISTING" -gt 0 ]; then
            echo "Migration notice already posted on this PR."
            exit 0
          fi

          curl -s -X POST \
            -H "Authorization: token $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/issues/${PR_NUMBER}/comments" \
            -d '{
              "body": "**Note:** This PR includes database migration changes. Migrations will be **auto-applied to the dev database** when this PR merges to main. Production migrations remain human-triggered.\n\nPlease ensure the migration is backwards-compatible with the current running code during the rollout window."
            }'

  # ---------------------------------------------------------------
  # Dispatcher image runtime version gate (#2972)
  # Builds Dockerfile.dispatcher and asserts Python >= 3.12 and
  # Node >= 20. Catches accidental base-image downgrades before
  # they reach production.
  # ---------------------------------------------------------------
  dispatcher-image-version-check:
    needs: detect-changes
    if: needs.detect-changes.outputs.dispatcher-image == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - name: Verify dispatcher image meets minimum runtime version requirements
        run: scripts/check-dispatcher-image-versions.sh --build Dockerfile.dispatcher

  # Always runs. Reports success only when every applicable job passed or was
  # skipped (path filter did not match). Branch protection requires this check.
  ci-passed:
    needs: [scraper-framework-tests, scraper-court-tests, ingestion-tests, nlp-tests, api-tests, web-tests, infra-validate, scripts-tests, coverage-check, deprecated-models-check, hardcoded-models-check, terraform-empty-resource-check, hardcoded-colors-check, admin-dispatcher-brand-accent-check, docs-tailwind-drift-check, llm-json-loads-check, oneshot-imports-check, oneshot-repo-paths-check, duplicate-functions-check, test-except-pass-check, markdown-links-check, schema-drift-check, dq-baselines-validate, ecs-oneshot-test, migration-files-check, migration-collision-check, nullable-column-reads-check, graphql-nullability-drift-check, sql-conflict-check, sql-column-check, playwright-browser-check, shard-coverage-check, apollo-keyfields-check, graphql-query-check, scraper-registry-check, preflight-hook-test, githooks-pre-push-test, ci-job-skipped-check, test-database-url-fallback-check, opensearch-url-fallback-check, no-api-github-fetch-check, dispatcher-terminal-consistency-check, dispatcher-image-version-check]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check all jobs passed or were skipped
        run: |
          results='${{ toJSON(needs) }}'
          echo "Job results: $results"
          if echo "$results" | grep -q '"result": "failure"'; then
            echo "One or more jobs failed."
            exit 1
          fi
          echo "All jobs passed or were skipped."
