name: CI

on:
  pull_request:
    branches: [main]
  # Push fires on all branches: main (for post-merge runs) and PR branches
  # (as a fallback when GitHub drops pull_request/synchronize events).
  # The concurrency group below deduplicates when both events fire.
  push:

# Cancel in-progress runs for the same branch/PR. When both push and
# pull_request events fire for the same commit, the second cancels the first
# so we never run duplicate CI.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      scraper: ${{ steps.changes.outputs.scraper }}
      scraper-framework: ${{ steps.changes.outputs.scraper-framework }}
      scraper-courts: ${{ steps.changes.outputs.scraper-courts }}
      nlp: ${{ steps.changes.outputs.nlp }}
      api: ${{ steps.changes.outputs.api }}
      web: ${{ steps.changes.outputs.web }}
      infra: ${{ steps.changes.outputs.infra }}
      telegram: ${{ steps.changes.outputs.telegram }}
      infra-lambda: ${{ steps.changes.outputs.infra-lambda }}
      scripts: ${{ steps.changes.outputs.scripts }}
      ecs-oneshot: ${{ steps.changes.outputs.ecs-oneshot }}
      migrations: ${{ steps.changes.outputs.migrations }}
      any-testable: ${{ steps.any-testable.outputs.result }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v4
        id: changes
        with:
          filters: |
            config:
              - 'packages/judgemind-config/**'
            scraper:
              - 'packages/scraper-framework/**'
              - 'packages/judgemind-config/**'
            scraper-framework:
              - 'packages/scraper-framework/src/framework/**'
              - 'packages/scraper-framework/src/ingestion/**'
              - 'packages/scraper-framework/src/templates/**'
              - 'packages/scraper-framework/src/validation/**'
              - 'packages/scraper-framework/tests/**'
              - 'packages/scraper-framework/pyproject.toml'
              - 'packages/judgemind-config/**'
            scraper-courts:
              - 'packages/scraper-framework/src/courts/**'
              - 'packages/scraper-framework/tests/courts/**'
              - 'packages/scraper-framework/tests/conftest.py'
              - 'packages/scraper-framework/pyproject.toml'
              - 'packages/judgemind-config/**'
            nlp:
              - 'packages/nlp-pipeline/**'
              - 'packages/judgemind-config/**'
            api:
              - 'packages/api/**'
            web:
              - 'packages/web/**'
            infra:
              - 'infra/**'
            telegram:
              - 'packages/telegram-bridge/**'
              - 'packages/judgemind-config/**'
            infra-lambda:
              - 'infra/telegram-bot/**'
            scripts:
              - 'scripts/**'
            ecs-oneshot:
              - 'scripts/*.py'
              - 'scripts/ecs-run-task.sh'
              - 'packages/scraper-framework/Dockerfile'
              - 'packages/scraper-framework/pyproject.toml'
              - '.github/ecs-oneshot-test/**'
            migrations:
              - 'packages/api/migrations/**'
      - name: Check if any coverage-producing package changed
        id: any-testable
        run: |
          if [ "${{ steps.changes.outputs.scraper }}" = "true" ] || \
             [ "${{ steps.changes.outputs.nlp }}" = "true" ] || \
             [ "${{ steps.changes.outputs.api }}" = "true" ] || \
             [ "${{ steps.changes.outputs.web }}" = "true" ] || \
             [ "${{ steps.changes.outputs.telegram }}" = "true" ] || \
             [ "${{ steps.changes.outputs.infra-lambda }}" = "true" ]; then
            echo "result=true" >> "$GITHUB_OUTPUT"
          else
            echo "result=false" >> "$GITHUB_OUTPUT"
          fi

  scraper-framework-tests:
    needs: detect-changes
    if: needs.detect-changes.outputs.scraper-framework == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/scraper-framework
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        id: setup-python
        with:
          python-version: '3.12'
      - uses: actions/cache@v5
        id: venv-cache
        with:
          path: packages/scraper-framework/.venv
          key: venv-scraper-${{ runner.os }}-py${{ steps.setup-python.outputs.python-version }}-${{ hashFiles('packages/scraper-framework/pyproject.toml') }}
      - name: Validate cached venv
        if: steps.venv-cache.outputs.cache-hit == 'true'
        run: |
          if ! .venv/bin/python --version > /dev/null 2>&1; then
            echo "Cached venv is invalid (Python version mismatch), recreating..."
            rm -rf .venv
            echo "venv-invalid=true" >> "$GITHUB_ENV"
          fi
      - name: Install dependencies
        if: steps.venv-cache.outputs.cache-hit != 'true' || env.venv-invalid == 'true'
        run: |
          python -m venv .venv
          .venv/bin/pip install -e ../../packages/judgemind-config
          .venv/bin/pip install -e ".[dev]"
      - name: Lint
        run: .venv/bin/ruff check src/ tests/
      - name: Format check
        run: .venv/bin/ruff format --check src/ tests/
      - name: Test
        run: >-
          .venv/bin/pytest tests/ -n auto -v --tb=short
          --ignore=tests/courts/
          --ignore=tests/test_reingest_from_s3.py
          --ignore=tests/test_reingest_registry.py
          --ignore=tests/test_ingestion.py
          --ignore=tests/test_extract.py
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-scraper-framework
          path: packages/scraper-framework/coverage.xml
      - name: Upload to Codecov
        if: always() && hashFiles('packages/scraper-framework/coverage.xml') != ''
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: packages/scraper-framework/coverage.xml
          flags: scraper-framework
          fail_ci_if_error: false

  scraper-court-tests:
    needs: detect-changes
    if: needs.detect-changes.outputs.scraper-courts == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/scraper-framework
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        id: setup-python
        with:
          python-version: '3.12'
      - uses: actions/cache@v5
        id: venv-cache
        with:
          path: packages/scraper-framework/.venv
          key: venv-scraper-${{ runner.os }}-py${{ steps.setup-python.outputs.python-version }}-${{ hashFiles('packages/scraper-framework/pyproject.toml') }}
      - name: Validate cached venv
        if: steps.venv-cache.outputs.cache-hit == 'true'
        run: |
          if ! .venv/bin/python --version > /dev/null 2>&1; then
            echo "Cached venv is invalid (Python version mismatch), recreating..."
            rm -rf .venv
            echo "venv-invalid=true" >> "$GITHUB_ENV"
          fi
      - name: Install dependencies
        if: steps.venv-cache.outputs.cache-hit != 'true' || env.venv-invalid == 'true'
        run: |
          python -m venv .venv
          .venv/bin/pip install -e ../../packages/judgemind-config
          .venv/bin/pip install -e ".[dev]"
      - name: Lint
        run: .venv/bin/ruff check src/ tests/
      - name: Format check
        run: .venv/bin/ruff format --check src/ tests/
      - name: Test
        run: .venv/bin/pytest tests/courts/ -n auto -v --tb=short
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-scraper-courts
          path: packages/scraper-framework/coverage.xml
      - name: Upload to Codecov
        if: always() && hashFiles('packages/scraper-framework/coverage.xml') != ''
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: packages/scraper-framework/coverage.xml
          flags: scraper-courts
          fail_ci_if_error: false

  ingestion-tests:
    needs: detect-changes
    if: needs.detect-changes.outputs.scraper == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/scraper-framework
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        id: setup-python
        with:
          python-version: '3.12'
      - uses: actions/cache@v5
        id: venv-cache
        with:
          path: packages/scraper-framework/.venv
          key: venv-scraper-${{ runner.os }}-py${{ steps.setup-python.outputs.python-version }}-${{ hashFiles('packages/scraper-framework/pyproject.toml') }}
      - name: Validate cached venv
        if: steps.venv-cache.outputs.cache-hit == 'true'
        run: |
          if ! .venv/bin/python --version > /dev/null 2>&1; then
            echo "Cached venv is invalid (Python version mismatch), recreating..."
            rm -rf .venv
            echo "venv-invalid=true" >> "$GITHUB_ENV"
          fi
      - name: Install dependencies
        if: steps.venv-cache.outputs.cache-hit != 'true' || env.venv-invalid == 'true'
        run: |
          python -m venv .venv
          .venv/bin/pip install -e ../../packages/judgemind-config
          .venv/bin/pip install -e ".[dev]"
      - name: Test
        run: >-
          .venv/bin/pytest
          tests/test_reingest_from_s3.py
          tests/test_reingest_registry.py
          tests/test_ingestion.py
          tests/test_extract.py
          -n auto -v --tb=short
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-scraper-ingestion
          path: packages/scraper-framework/coverage.xml
      - name: Upload to Codecov
        if: always() && hashFiles('packages/scraper-framework/coverage.xml') != ''
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: packages/scraper-framework/coverage.xml
          flags: scraper-ingestion
          fail_ci_if_error: false

  nlp-tests:
    needs: detect-changes
    if: needs.detect-changes.outputs.nlp == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/nlp-pipeline
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        id: setup-python
        with:
          python-version: '3.12'
      - uses: actions/cache@v5
        id: venv-cache
        with:
          path: packages/nlp-pipeline/.venv
          key: venv-nlp-${{ runner.os }}-py${{ steps.setup-python.outputs.python-version }}-${{ hashFiles('packages/nlp-pipeline/pyproject.toml') }}
      - name: Validate cached venv
        if: steps.venv-cache.outputs.cache-hit == 'true'
        run: |
          if ! .venv/bin/python --version > /dev/null 2>&1; then
            echo "Cached venv is invalid (Python version mismatch), recreating..."
            rm -rf .venv
            echo "venv-invalid=true" >> "$GITHUB_ENV"
          fi
      - name: Install dependencies
        if: steps.venv-cache.outputs.cache-hit != 'true' || env.venv-invalid == 'true'
        run: |
          python -m venv .venv
          .venv/bin/pip install -e ../../packages/judgemind-config
          .venv/bin/pip install -e ".[dev]"
      - name: Lint
        run: .venv/bin/ruff check src/ tests/
      - name: Format check
        run: .venv/bin/ruff format --check src/ tests/
      - name: Test
        run: .venv/bin/pytest tests/ -v --tb=short
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-nlp
          path: packages/nlp-pipeline/coverage.xml
      - name: Upload to Codecov
        if: always() && hashFiles('packages/nlp-pipeline/coverage.xml') != ''
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: packages/nlp-pipeline/coverage.xml
          flags: nlp
          fail_ci_if_error: false

  api-tests:
    needs: detect-changes
    if: needs.detect-changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/api
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: judgemind
          POSTGRES_PASSWORD: localdev
          POSTGRES_DB: judgemind
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      opensearch:
        image: opensearchproject/opensearch:2.12.0
        env:
          discovery.type: single-node
          DISABLE_SECURITY_PLUGIN: "true"
          OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
        ports:
          - 9200:9200
        options: >-
          --health-cmd "curl -sf http://localhost:9200/_cluster/health || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://judgemind:localdev@localhost:5432/judgemind
      OPENSEARCH_URL: http://localhost:9200
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm ci
      - name: Run database migrations
        run: npm run db:migrate
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Test
        run: npx vitest run --coverage --passWithNoTests
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-api
          path: packages/api/coverage/lcov.info
      - name: Upload to Codecov
        if: always() && hashFiles('packages/api/coverage/lcov.info') != ''
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: packages/api/coverage/lcov.info
          flags: api
          fail_ci_if_error: false

  web-tests:
    needs: detect-changes
    if: needs.detect-changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/web
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Test
        run: npx vitest run --coverage --passWithNoTests
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-web
          path: packages/web/coverage/lcov.info
      - name: Upload to Codecov
        if: always() && hashFiles('packages/web/coverage/lcov.info') != ''
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: packages/web/coverage/lcov.info
          flags: web
          fail_ci_if_error: false
      - name: Build
        run: npm run build

  telegram-bridge-tests:
    needs: detect-changes
    if: needs.detect-changes.outputs.telegram == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/telegram-bridge
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        id: setup-python
        with:
          python-version: '3.12'
      - uses: actions/cache@v5
        id: venv-cache
        with:
          path: packages/telegram-bridge/.venv
          key: venv-telegram-${{ runner.os }}-py${{ steps.setup-python.outputs.python-version }}-${{ hashFiles('packages/telegram-bridge/pyproject.toml') }}
      - name: Validate cached venv
        if: steps.venv-cache.outputs.cache-hit == 'true'
        run: |
          if ! .venv/bin/python --version > /dev/null 2>&1; then
            echo "Cached venv is invalid (Python version mismatch), recreating..."
            rm -rf .venv
            echo "venv-invalid=true" >> "$GITHUB_ENV"
          fi
      - name: Install dependencies
        if: steps.venv-cache.outputs.cache-hit != 'true' || env.venv-invalid == 'true'
        run: |
          python -m venv .venv
          .venv/bin/pip install -e ../../packages/judgemind-config
          .venv/bin/pip install -e ".[dev]"
      - name: Lint
        run: .venv/bin/ruff check src/ tests/
      - name: Format check
        run: .venv/bin/ruff format --check src/ tests/
      - name: Test
        run: .venv/bin/pytest tests/ -v --tb=short
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-telegram
          path: packages/telegram-bridge/coverage.xml
      - name: Upload to Codecov
        if: always() && hashFiles('packages/telegram-bridge/coverage.xml') != ''
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: packages/telegram-bridge/coverage.xml
          flags: telegram-bridge
          fail_ci_if_error: false

  infra-validate:
    needs: detect-changes
    if: needs.detect-changes.outputs.infra == 'true'
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: us-west-2
      TF_IN_AUTOMATION: true
    steps:
      - uses: actions/checkout@v6
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: '1.7'
      - name: Terraform fmt check
        run: terraform fmt -check -recursive infra/terraform/

      # Validate each environment (no credentials needed)
      - name: Validate dev
        run: |
          terraform -chdir=infra/terraform/environments/dev init -backend=false
          terraform -chdir=infra/terraform/environments/dev validate
      - name: Validate production
        run: |
          terraform -chdir=infra/terraform/environments/production init -backend=false
          terraform -chdir=infra/terraform/environments/production validate

      # Plan with real backend to catch provider-specific attribute errors
      # (e.g. wrong resource attribute names that `validate` misses).
      # Skipped if AWS credentials are not configured.
      - name: Terraform Init (dev)
        if: env.AWS_ACCESS_KEY_ID != ''
        run: terraform -chdir=infra/terraform/environments/dev init
      - name: Terraform Plan (dev)
        if: env.AWS_ACCESS_KEY_ID != ''
        run: terraform -chdir=infra/terraform/environments/dev plan -no-color -input=false

  lambda-tests:
    needs: detect-changes
    if: needs.detect-changes.outputs.infra-lambda == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        lambda-dir:
          - infra/telegram-bot
    defaults:
      run:
        working-directory: ${{ matrix.lambda-dir }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        id: setup-python
        with:
          python-version: '3.12'
      - uses: actions/cache@v5
        id: venv-cache
        with:
          path: ${{ matrix.lambda-dir }}/.venv
          key: venv-${{ matrix.lambda-dir }}-${{ runner.os }}-py${{ steps.setup-python.outputs.python-version }}-${{ hashFiles(format('{0}/pyproject.toml', matrix.lambda-dir)) }}
      - name: Validate cached venv
        if: steps.venv-cache.outputs.cache-hit == 'true'
        run: |
          if ! .venv/bin/python --version > /dev/null 2>&1; then
            echo "Cached venv is invalid (Python version mismatch), recreating..."
            rm -rf .venv
            echo "venv-invalid=true" >> "$GITHUB_ENV"
          fi
      - name: Install dependencies
        if: steps.venv-cache.outputs.cache-hit != 'true' || env.venv-invalid == 'true'
        run: |
          python -m venv .venv
          .venv/bin/pip install -e ".[dev]"
      - name: Lint
        run: .venv/bin/ruff check .
      - name: Format check
        run: .venv/bin/ruff format --check .
      - name: Test
        run: .venv/bin/pytest tests/ -v --tb=short
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-lambda-telegram-bot
          path: ${{ matrix.lambda-dir }}/coverage.xml
      - name: Upload to Codecov
        if: always() && hashFiles(format('{0}/coverage.xml', matrix.lambda-dir)) != ''
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ${{ matrix.lambda-dir }}/coverage.xml
          flags: lambda-telegram-bot
          fail_ci_if_error: false

  scripts-tests:
    needs: detect-changes
    if: needs.detect-changes.outputs.scripts == 'true'
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: scripts
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: pip install pytest boto3 -e packages/judgemind-config
      - name: Test
        run: pytest scripts/tests/ -v --tb=short
      - name: Check AWS CLI boolean flag usage
        run: scripts/check-aws-bool-flags.sh
      - name: Test AWS CLI boolean flag checker
        run: scripts/tests/test_check_aws_bool_flags.sh
      - name: Test deprecated model checker
        run: scripts/tests/test_check_deprecated_models.sh
      - name: Test hardcoded model checker
        run: scripts/tests/test_check_hardcoded_models.sh
      - name: Test schema drift checker
        run: scripts/tests/test_check_schema_drift.sh
      - name: Test duplicate function checker
        run: scripts/tests/test_check_duplicate_functions.sh
      - name: Test migration files checker
        run: scripts/tests/test_check_migration_files.sh
      - name: Test gemini-review.sh smoke tests
        run: scripts/tests/test_gemini_review.sh

  # ---------------------------------------------------------------
  # Coverage gates: diff coverage (new lines) + overall floor ratchet
  # ---------------------------------------------------------------
  coverage-check:
    needs: [detect-changes, scraper-framework-tests, scraper-court-tests, ingestion-tests, nlp-tests, api-tests, web-tests, telegram-bridge-tests, lambda-tests]
    if: always() && github.event_name == 'pull_request' && needs.detect-changes.outputs.any-testable == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install diff-cover
        run: pip install diff-cover

      # Download all coverage artifacts (each upload is optional — packages
      # that were skipped or had no tests will simply be missing).
      - uses: actions/download-artifact@v8
        with:
          pattern: coverage-*
          path: coverage-artifacts/
          merge-multiple: false

      - name: List downloaded artifacts
        run: find coverage-artifacts/ -type f 2>/dev/null || echo "No artifacts"

      # --- Diff coverage checks (new/changed lines must be >= 90% covered) ---

      - name: Diff coverage — scraper-framework
        if: needs.detect-changes.outputs.scraper == 'true'
        run: |
          COV_FRAMEWORK="coverage-artifacts/coverage-scraper-framework/coverage.xml"
          COV_COURTS="coverage-artifacts/coverage-scraper-courts/coverage.xml"
          COV_INGEST="coverage-artifacts/coverage-scraper-ingestion/coverage.xml"
          COV_FILES=""
          if [ -f "$COV_FRAMEWORK" ]; then COV_FILES="$COV_FRAMEWORK"; fi
          if [ -f "$COV_COURTS" ]; then COV_FILES="$COV_FILES $COV_COURTS"; fi
          if [ -f "$COV_INGEST" ]; then COV_FILES="$COV_FILES $COV_INGEST"; fi
          if [ -n "$COV_FILES" ]; then
            diff-cover $COV_FILES --compare-branch=origin/main --fail-under=90 --diff-range-notation='..'
          else
            echo "No coverage artifact for scraper-framework — skipping diff-cover"
          fi

      - name: Diff coverage — nlp-pipeline
        if: needs.detect-changes.outputs.nlp == 'true'
        run: |
          COV_FILE="coverage-artifacts/coverage-nlp/coverage.xml"
          if [ -f "$COV_FILE" ]; then
            diff-cover "$COV_FILE" --compare-branch=origin/main --fail-under=90 --diff-range-notation='..'
          else
            echo "No coverage artifact for nlp-pipeline — skipping diff-cover"
          fi

      - name: Diff coverage — telegram-bridge
        if: needs.detect-changes.outputs.telegram == 'true'
        run: |
          COV_FILE="coverage-artifacts/coverage-telegram/coverage.xml"
          if [ -f "$COV_FILE" ]; then
            diff-cover "$COV_FILE" --compare-branch=origin/main --fail-under=90 --diff-range-notation='..'
          else
            echo "No coverage artifact for telegram-bridge — skipping diff-cover"
          fi

      - name: Diff coverage — lambda-telegram-bot
        if: needs.detect-changes.outputs.infra-lambda == 'true'
        run: |
          COV_FILE="coverage-artifacts/coverage-lambda-telegram-bot/coverage.xml"
          if [ -f "$COV_FILE" ]; then
            diff-cover "$COV_FILE" --compare-branch=origin/main --fail-under=90 --diff-range-notation='..'
          else
            echo "No coverage artifact for lambda-telegram-bot — skipping diff-cover"
          fi

      - name: Diff coverage — api
        if: needs.detect-changes.outputs.api == 'true'
        run: |
          COV_FILE="coverage-artifacts/coverage-api/lcov.info"
          if [ -f "$COV_FILE" ]; then
            diff-cover "$COV_FILE" --compare-branch=origin/main --fail-under=90 --diff-range-notation='..'
          else
            echo "No coverage artifact for api — skipping diff-cover"
          fi

      - name: Diff coverage — web
        if: needs.detect-changes.outputs.web == 'true'
        run: |
          COV_FILE="coverage-artifacts/coverage-web/lcov.info"
          if [ -f "$COV_FILE" ]; then
            diff-cover "$COV_FILE" --compare-branch=origin/main --fail-under=90 --diff-range-notation='..'
          else
            echo "No coverage artifact for web — skipping diff-cover"
          fi

      # --- Overall coverage floor ratchet ---
      # Fails if any package's coverage dropped below its baseline.

      - name: Coverage floor ratchet — scraper-framework
        if: needs.detect-changes.outputs.scraper == 'true'
        run: |
          # Merge coverage from all three split scraper test jobs.
          # Only enforce the floor ratchet when both framework AND court
          # coverage files are present.  When court tests are skipped
          # (because no court files changed), the partial coverage from
          # framework-only tests is lower than the combined baseline and
          # would false-fail the check.  Diff-cover still guards new lines.
          COV_ARGS=""
          COV_FRAMEWORK="coverage-artifacts/coverage-scraper-framework/coverage.xml"
          COV_COURTS="coverage-artifacts/coverage-scraper-courts/coverage.xml"
          COV_INGEST="coverage-artifacts/coverage-scraper-ingestion/coverage.xml"
          HAS_ANY=false
          for f in "$COV_FRAMEWORK" "$COV_COURTS" "$COV_INGEST"; do
            if [ -f "$f" ]; then
              COV_ARGS="$COV_ARGS --coverage-file $f"
              HAS_ANY=true
            fi
          done
          if [ "$HAS_ANY" = "false" ]; then
            echo "No coverage artifacts found — skipping floor ratchet"
            exit 0
          fi
          # Skip floor ratchet if court tests didn't run (partial coverage
          # would be lower than the combined baseline).
          if [ ! -f "$COV_COURTS" ] && [ ! -f "$COV_FRAMEWORK" ]; then
            echo "Neither framework nor court coverage available — skipping"
            exit 0
          fi
          if [ ! -f "$COV_COURTS" ]; then
            echo "Court test coverage missing (court tests skipped) — skipping floor ratchet to avoid false failure from partial coverage"
            exit 0
          fi
          python scripts/update-coverage-baselines.py \
            --package packages/scraper-framework \
            $COV_ARGS \
            --dry-run

      - name: Coverage floor ratchet — nlp-pipeline
        if: needs.detect-changes.outputs.nlp == 'true'
        run: |
          COV_FILE="coverage-artifacts/coverage-nlp/coverage.xml"
          if [ -f "$COV_FILE" ]; then
            python scripts/update-coverage-baselines.py \
              --package packages/nlp-pipeline \
              --coverage-file "$COV_FILE" \
              --dry-run
          fi

      - name: Coverage floor ratchet — telegram-bridge
        if: needs.detect-changes.outputs.telegram == 'true'
        run: |
          COV_FILE="coverage-artifacts/coverage-telegram/coverage.xml"
          if [ -f "$COV_FILE" ]; then
            python scripts/update-coverage-baselines.py \
              --package packages/telegram-bridge \
              --coverage-file "$COV_FILE" \
              --dry-run
          fi

      - name: Coverage floor ratchet — lambda-telegram-bot
        if: needs.detect-changes.outputs.infra-lambda == 'true'
        run: |
          COV_FILE="coverage-artifacts/coverage-lambda-telegram-bot/coverage.xml"
          if [ -f "$COV_FILE" ]; then
            python scripts/update-coverage-baselines.py \
              --package infra/telegram-bot \
              --coverage-file "$COV_FILE" \
              --dry-run
          fi

      - name: Coverage floor ratchet — api
        if: needs.detect-changes.outputs.api == 'true'
        run: |
          COV_FILE="coverage-artifacts/coverage-api/lcov.info"
          if [ -f "$COV_FILE" ]; then
            python scripts/update-coverage-baselines.py \
              --package packages/api \
              --coverage-file "$COV_FILE" \
              --dry-run
          fi

      - name: Coverage floor ratchet — web
        if: needs.detect-changes.outputs.web == 'true'
        run: |
          COV_FILE="coverage-artifacts/coverage-web/lcov.info"
          if [ -f "$COV_FILE" ]; then
            python scripts/update-coverage-baselines.py \
              --package packages/web \
              --coverage-file "$COV_FILE" \
              --dry-run
          fi

  # ---------------------------------------------------------------
  # Data quality baselines structural validation
  # ---------------------------------------------------------------
  dq-baselines-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Validate data-quality-baselines.json
        run: python scripts/validate-dq-baselines.py

  # ---------------------------------------------------------------
  # Deprecated model guard: prevent use of deprecated Anthropic models
  # ---------------------------------------------------------------
  deprecated-models-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check for deprecated Anthropic model identifiers
        run: scripts/check-deprecated-models.sh

  # ---------------------------------------------------------------
  # Hardcoded model guard: enforce model ID centralization
  # ---------------------------------------------------------------
  hardcoded-models-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check for hardcoded Claude model identifiers
        run: scripts/check-hardcoded-models.sh

  # ---------------------------------------------------------------
  # Hardcoded color guard: enforce semantic design tokens in TSX
  # ---------------------------------------------------------------
  hardcoded-colors-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check for hardcoded Tailwind color classes in TSX
        run: scripts/check-hardcoded-colors.sh

  # ---------------------------------------------------------------
  # Schema drift guard: migration tables must exist in schema.sql
  # ---------------------------------------------------------------
  schema-drift-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check for schema.sql and migration table drift
        run: scripts/check-schema-drift.sh

  # ---------------------------------------------------------------
  # Migration file guard: validate naming and sequencing
  # ---------------------------------------------------------------
  migration-files-check:
    needs: detect-changes
    if: needs.detect-changes.outputs.migrations == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Validate migration file naming and sequencing
        run: scripts/check-migration-files.sh

  # ---------------------------------------------------------------
  # ECS oneshot import guard: prevent scripts/ from importing siblings
  # ---------------------------------------------------------------
  oneshot-imports-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check for sibling imports in oneshot scripts
        run: scripts/check-oneshot-imports.sh

  # ---------------------------------------------------------------
  # Duplicate function guard: detect shadowed function definitions
  # ---------------------------------------------------------------
  duplicate-functions-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check for duplicate function definitions in Python
        run: scripts/check-duplicate-functions.sh

  # ---------------------------------------------------------------
  # SQL ON CONFLICT target validation: verify conflict targets match schema
  # ---------------------------------------------------------------
  sql-conflict-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Validate ON CONFLICT targets against schema constraints
        run: python3 scripts/check-sql-conflicts.py

  # ---------------------------------------------------------------
  # ECS oneshot Docker integration test: run scripts in a container
  # ---------------------------------------------------------------
  ecs-oneshot-test:
    needs: detect-changes
    if: needs.detect-changes.outputs.ecs-oneshot == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Run ECS oneshot integration tests
        run: .github/ecs-oneshot-test/run-tests.sh

  # ---------------------------------------------------------------
  # Migration notice: comment on PRs that include migration changes
  # ---------------------------------------------------------------
  migration-notice:
    needs: detect-changes
    if: github.event_name == 'pull_request' && needs.detect-changes.outputs.migrations == 'true'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Post migration notice
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          # Check if we already posted a migration notice on this PR
          EXISTING=$(curl -s \
            -H "Authorization: token $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/issues/${PR_NUMBER}/comments" \
            | jq '[.[] | select(.body | contains("database migration"))] | length')

          if [ "$EXISTING" -gt 0 ]; then
            echo "Migration notice already posted on this PR."
            exit 0
          fi

          curl -s -X POST \
            -H "Authorization: token $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/issues/${PR_NUMBER}/comments" \
            -d '{
              "body": "**Note:** This PR includes database migration changes. Migrations will be **auto-applied to the dev database** when this PR merges to main. Production migrations remain human-triggered.\n\nPlease ensure the migration is backwards-compatible with the current running code during the rollout window."
            }'

  # Always runs. Reports success only when every applicable job passed or was
  # skipped (path filter did not match). Branch protection requires this check.
  ci-passed:
    needs: [scraper-framework-tests, scraper-court-tests, ingestion-tests, nlp-tests, api-tests, web-tests, telegram-bridge-tests, infra-validate, lambda-tests, scripts-tests, coverage-check, deprecated-models-check, hardcoded-models-check, hardcoded-colors-check, oneshot-imports-check, duplicate-functions-check, schema-drift-check, dq-baselines-validate, ecs-oneshot-test, migration-files-check, sql-conflict-check]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check all jobs passed or were skipped
        run: |
          results='${{ toJSON(needs) }}'
          echo "Job results: $results"
          if echo "$results" | grep -q '"result": "failure"'; then
            echo "One or more jobs failed."
            exit 1
          fi
          echo "All jobs passed or were skipped."
