name: CI

on:
  pull_request:
    branches: [main]
  # Push fires on all branches: main (for post-merge runs) and PR branches
  # (as a fallback when GitHub drops pull_request/synchronize events).
  # The concurrency group below deduplicates when both events fire.
  push:

# Cancel in-progress runs for the same branch/PR. When both push and
# pull_request events fire for the same commit, the second cancels the first
# so we never run duplicate CI.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      scraper: ${{ steps.changes.outputs.scraper }}
      nlp: ${{ steps.changes.outputs.nlp }}
      api: ${{ steps.changes.outputs.api }}
      web: ${{ steps.changes.outputs.web }}
      infra: ${{ steps.changes.outputs.infra }}
      telegram: ${{ steps.changes.outputs.telegram }}
      infra-lambda: ${{ steps.changes.outputs.infra-lambda }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            scraper:
              - 'packages/scraper-framework/**'
            nlp:
              - 'packages/nlp-pipeline/**'
            api:
              - 'packages/api/**'
            web:
              - 'packages/web/**'
            infra:
              - 'infra/**'
            telegram:
              - 'packages/telegram-bridge/**'
            infra-lambda:
              - 'infra/telegram-bot/**'

  scraper-unit-tests:
    needs: detect-changes
    if: needs.detect-changes.outputs.scraper == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/scraper-framework
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        id: venv-cache
        with:
          path: packages/scraper-framework/.venv
          key: venv-scraper-${{ runner.os }}-py3.12-${{ hashFiles('packages/scraper-framework/pyproject.toml') }}
      - name: Install dependencies
        if: steps.venv-cache.outputs.cache-hit != 'true'
        run: |
          python -m venv .venv
          .venv/bin/pip install -e ".[dev]"
      - name: Lint
        run: .venv/bin/ruff check src/ tests/
      - name: Format check
        run: .venv/bin/ruff format --check src/ tests/
      - name: Test
        run: >-
          .venv/bin/pytest tests/ -n 8 -v --tb=short
          --ignore=tests/test_reingest_from_s3.py
          --ignore=tests/test_reingest_registry.py
          --ignore=tests/test_ingestion.py
          --ignore=tests/test_extract.py
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-scraper-unit
          path: packages/scraper-framework/coverage.xml

  ingestion-tests:
    needs: detect-changes
    if: needs.detect-changes.outputs.scraper == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/scraper-framework
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        id: venv-cache
        with:
          path: packages/scraper-framework/.venv
          key: venv-scraper-${{ runner.os }}-py3.12-${{ hashFiles('packages/scraper-framework/pyproject.toml') }}
      - name: Install dependencies
        if: steps.venv-cache.outputs.cache-hit != 'true'
        run: |
          python -m venv .venv
          .venv/bin/pip install -e ".[dev]"
      - name: Test
        run: >-
          .venv/bin/pytest
          tests/test_reingest_from_s3.py
          tests/test_reingest_registry.py
          tests/test_ingestion.py
          tests/test_extract.py
          -n 8 -v --tb=short
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-scraper-ingestion
          path: packages/scraper-framework/coverage.xml

  nlp-tests:
    needs: detect-changes
    if: needs.detect-changes.outputs.nlp == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/nlp-pipeline
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        id: venv-cache
        with:
          path: packages/nlp-pipeline/.venv
          key: venv-nlp-${{ runner.os }}-py3.12-${{ hashFiles('packages/nlp-pipeline/pyproject.toml') }}
      - name: Install dependencies
        if: steps.venv-cache.outputs.cache-hit != 'true'
        run: |
          python -m venv .venv
          .venv/bin/pip install -e ".[dev]"
      - name: Lint
        run: .venv/bin/ruff check src/ tests/
      - name: Format check
        run: .venv/bin/ruff format --check src/ tests/
      - name: Test
        run: .venv/bin/pytest tests/ -v --tb=short
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-nlp
          path: packages/nlp-pipeline/coverage.xml

  api-tests:
    needs: detect-changes
    if: needs.detect-changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/api
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: judgemind
          POSTGRES_PASSWORD: localdev
          POSTGRES_DB: judgemind
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      opensearch:
        image: opensearchproject/opensearch:2.12.0
        env:
          discovery.type: single-node
          DISABLE_SECURITY_PLUGIN: "true"
          OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
        ports:
          - 9200:9200
        options: >-
          --health-cmd "curl -sf http://localhost:9200/_cluster/health || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://judgemind:localdev@localhost:5432/judgemind
      OPENSEARCH_URL: http://localhost:9200
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm ci
      - name: Run database migrations
        run: npm run db:migrate
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Test
        run: npx vitest run --coverage --passWithNoTests
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-api
          path: packages/api/coverage/lcov.info

  web-tests:
    needs: detect-changes
    if: needs.detect-changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Test
        run: npx vitest run --coverage --passWithNoTests
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-web
          path: packages/web/coverage/lcov.info
      - name: Build
        run: npm run build

  telegram-bridge-tests:
    needs: detect-changes
    if: needs.detect-changes.outputs.telegram == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/telegram-bridge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        id: venv-cache
        with:
          path: packages/telegram-bridge/.venv
          key: venv-telegram-${{ runner.os }}-py3.12-${{ hashFiles('packages/telegram-bridge/pyproject.toml') }}
      - name: Install dependencies
        if: steps.venv-cache.outputs.cache-hit != 'true'
        run: |
          python -m venv .venv
          .venv/bin/pip install -e ".[dev]"
      - name: Lint
        run: .venv/bin/ruff check src/ tests/
      - name: Format check
        run: .venv/bin/ruff format --check src/ tests/
      - name: Test
        run: .venv/bin/pytest tests/ -v --tb=short
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-telegram
          path: packages/telegram-bridge/coverage.xml

  infra-validate:
    needs: detect-changes
    if: needs.detect-changes.outputs.infra == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.7'
      - name: Terraform fmt check
        run: terraform fmt -check -recursive
      - name: Terraform validate
        run: |
          terraform init -backend=false
          terraform validate

  lambda-tests:
    needs: detect-changes
    if: needs.detect-changes.outputs.infra-lambda == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        lambda-dir:
          - infra/telegram-bot
    defaults:
      run:
        working-directory: ${{ matrix.lambda-dir }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        id: venv-cache
        with:
          path: ${{ matrix.lambda-dir }}/.venv
          key: venv-${{ matrix.lambda-dir }}-${{ runner.os }}-py3.12-${{ hashFiles(format('{0}/pyproject.toml', matrix.lambda-dir)) }}
      - name: Install dependencies
        if: steps.venv-cache.outputs.cache-hit != 'true'
        run: |
          python -m venv .venv
          .venv/bin/pip install -e ".[dev]"
      - name: Lint
        run: .venv/bin/ruff check .
      - name: Format check
        run: .venv/bin/ruff format --check .
      - name: Test
        run: .venv/bin/pytest tests/ -v --tb=short
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-lambda-telegram-bot
          path: ${{ matrix.lambda-dir }}/coverage.xml

  # Always runs. Reports success only when every applicable job passed or was
  # skipped (path filter did not match). Branch protection requires this check.
  ci-passed:
    needs: [scraper-unit-tests, ingestion-tests, nlp-tests, api-tests, web-tests, telegram-bridge-tests, infra-validate, lambda-tests]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check all jobs passed or were skipped
        run: |
          results='${{ toJSON(needs) }}'
          echo "Job results: $results"
          if echo "$results" | grep -q '"result": "failure"'; then
            echo "One or more jobs failed."
            exit 1
          fi
          echo "All jobs passed or were skipped."
