name: Validate Verify SQL columns

# Lint the SQL columns referenced in any ``Verify:`` line of an issue
# body against packages/api/src/data-access/schema.sql. If the script
# (scripts/check-issue-verify-sql.py) finds a column-not-found
# mismatch, post a comment on the issue and strip the agent/ready
# label so the issue is not picked up before the AC is corrected.
#
# Tracking: issue #4358 (parent: #4319, surfaced via #4309).

on:
  issues:
    types: [opened, edited]

jobs:
  validate-verify-sql:
    if: github.event.issue.state == 'open'
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Run check-issue-verify-sql.py
        id: check
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          set +e
          ./scripts/check-issue-verify-sql.py --issue "$ISSUE_NUMBER" \
            > "$RUNNER_TEMP/check.stdout" 2> "$RUNNER_TEMP/check.stderr"
          rc=$?
          set -e
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          {
            echo "stderr<<__EOF__"
            cat "$RUNNER_TEMP/check.stderr"
            echo "__EOF__"
          } >> "$GITHUB_OUTPUT"
          # Exit 0 always — we surface the result via outputs and let
          # the next step decide. (Exit 2 = gh/schema failure; we
          # don't want infrastructure flakes to block issue authoring.)
          exit 0
      - name: Comment + strip agent/ready on column mismatch
        if: steps.check.outputs.rc == '1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          REPO: ${{ github.repository }}
          DIAGNOSTIC: ${{ steps.check.outputs.stderr }}
        run: |
          {
            echo "## SQL column validation failed"
            echo
            echo 'A \`Verify:\` line in this issue references a column that does not exist on the named table per \`packages/api/src/data-access/schema.sql\`.'
            echo
            echo '```'
            printf '%s\n' "$DIAGNOSTIC"
            echo '```'
            echo
            echo 'Fix: update the \`Verify:\` line to use real column names. See \`docs/agent/issue-authoring.md\` §"Verify lines on SQL queries" and the dispatcher schema in \`packages/api/src/data-access/schema.sql\`.'
            echo
            echo 'The \`agent/ready\` label has been removed; re-add it once the AC is corrected. (Tracking: #4358.)'
          } > "$RUNNER_TEMP/comment.md"

          gh issue comment "$ISSUE_NUMBER" --repo "$REPO" \
            --body-file "$RUNNER_TEMP/comment.md"

          gh issue edit "$ISSUE_NUMBER" --repo "$REPO" \
            --remove-label "agent/ready" || true

          # Fail the workflow so the check is visible on the issue's
          # workflow runs list. The label / comment side-effects above
          # already happened.
          exit 1
      - name: Note infrastructure failure (rc=2) but do not block
        if: steps.check.outputs.rc == '2'
        run: |
          echo "::warning::check-issue-verify-sql.py exited 2 — gh fetch or schema parse failed; not blocking issue authoring."
          cat "$RUNNER_TEMP/check.stderr" || true
