name: Deploy Scraper (Production)

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag to deploy (SHA or tag from ECR)"
        required: true
        type: string

concurrency:
  group: deploy-scraper-production
  cancel-in-progress: true

env:
  AWS_REGION: us-west-2
  ECR_REPOSITORY: judgemind/scraper
  ECS_CLUSTER: judgemind-production
  TASK_FAMILY: judgemind-scraper-production
  SCHEDULER_NAME: judgemind-scraper-production
  CONTAINER_NAME: scraper

jobs:
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Get AWS account ID
        id: aws-account
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          echo "id=$ACCOUNT_ID" >> "$GITHUB_OUTPUT"

      - name: Checkout (for composite action)
        uses: actions/checkout@v6

      - name: Set pending deployment status
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -s -X POST \
            -H "Authorization: token $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/statuses/${{ github.sha }}" \
            -d '{
              "state": "pending",
              "description": "Deploying scraper to production...",
              "context": "deploy/production"
            }'

      - name: Verify image exists in ECR
        env:
          ECR_REGISTRY: ${{ steps.aws-account.outputs.id }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          echo "Verifying image $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG exists..."
          aws ecr describe-images \
            --repository-name "$ECR_REPOSITORY" \
            --image-ids imageTag="$IMAGE_TAG" \
            --query 'imageDetails[0].imageTags' \
            --output json

          echo "image_uri=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> "$GITHUB_OUTPUT"
        id: verify-image

      - name: Deploy to ECS
        id: deploy
        uses: ./.github/actions/ecs-deploy
        with:
          task-family: ${{ env.TASK_FAMILY }}
          container-name: ${{ env.CONTAINER_NAME }}
          image-uri: ${{ steps.verify-image.outputs.image_uri }}
          deploy-mode: scheduler
          scheduler-name: ${{ env.SCHEDULER_NAME }}

      - name: Set deployment status
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEPLOY_STATUS: ${{ job.status == 'success' && 'success' || 'failure' }}
          DEPLOY_DESC: ${{ job.status == 'success' && 'Scraper deployed to production' || 'Production deployment failed' }}
        run: |
          curl -s -X POST \
            -H "Authorization: token $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/statuses/${{ github.sha }}" \
            -d "{
              \"state\": \"$DEPLOY_STATUS\",
              \"description\": \"$DEPLOY_DESC\",
              \"context\": \"deploy/production\"
            }"
